 Decks Rulebook (4th Edition)]] (with component list, credits, and flagged inconsistencies/open questions).\n- 62 concept pages covering the core system (Cycle of Life, turn structure, board zones, placement rules), all card types, all deck types, core mechanics (Revival, Curses, Jewels, Stars, Keys, Hearts, communication), all 11 Stages (A–F and A+–E+), and all modes (Difficulty, Player Counts, Practice, Solo, Story, Creative, Advanced).\n- 52 entity pages: the 24 [[Eternals]] plus a family overview page, [[Gatekeeper]], [[Explorers]], [[The Alchemist]], [[Eternal World]], [[Ouroboros Ring]], all 15 Field Cards, and 7 credited people/organizations.\n- Rewrote [[overview]] as a synthesis and rebuilt [[index]] as a full catalog.\n\nFlagged for future attention: Golem naming contradiction (Alpha/Beta/Gamma vs \"Alpha, Gamma, Delta\"), the \"Baron's Curse\" typo, the underspecified third Stage F hand recipe, unlisted Individual Revival Boards, and untranscribed per-Eternal deck lists. No secondary sources (FAQ, errata, strategy, reviews) ingested yet.\n\n## [2026-07-21] query | Board location notation convention\n\nEstablished the vault's standard notation for board places and cards, saved as [[Board Locations and Notation]] (questions/): T/M/B rows with fixed left-to-right space numbers (x1–x7), FC-T/M/B Field Card slots, 4LB-T/M/B bonus rows, Riv1–5, RA1–9, GK@n HP notation, and card shorthand (y5, rg 4/9, b-skull, etc.). Flagged that the 7-space row length is inferred from diagrams/examples, not printed prose — needs verification against the physical board. Linked from the index.\n\n## [2026-07-21] query | Protocol for Claude as a second player\n\nDesigned and saved [[Playing with Claude as a Second Player]] (questions/). Primary mode uses the maintainer's blind-photo idea: the AI's hand is photographed face-up without the human looking, so BOTH hands stay hidden and the full Communication Disc / Verbal Discussion game applies two-way. Includes the position-based instruction loop (\"flip position 2, play to T4\"), draw/gift handling, misread and accidental-peek house rules, AI state blocks with board photos, and fallback open-hand modes (sanctioned by Solo Play's face-up precedent). Linked from the index.\n\n## [2026-07-21] maintenance | Two-Color Card adjacency correction\n\nRe-read Basic Rulebook pp. 05/09/back-cover to answer a live rules question. Corrected [[Two-Color Cards]]: rotation selects the active *number* only; for color adjacency the card always counts as both its colors on both sides (no choice, no side-split). Noted the unresolved edge case of whether the inactive number blocks same-number adjacency.\n\n## [2026-07-21] maintenance | Two-Color Card model corrected (again) with physical evidence\n\nThe maintainer verified on the physical cards that Two-Color Cards carry ONE number (corner indices misread as two numbers in the previous correction). Rewrote [[Two-Color Cards]]: rotation chooses which color faces left vs right, and adjacency is checked per side (left-side color vs left neighbor, right-side color vs right neighbor) — the rulebook's paired left-side/right-side clauses. The card still counts as both colors for Curses and for Lake/Swamp cycle determination. Superseded the same-day both-colors-both-sides entry above.\n", "folder": ""}, "overview": {"md": "# Overview\n\nCurrent synthesis of the wiki's knowledge about **Eternal Decks**, a cooperative card game system designed by [[Hiroken]] and published by [[Tricktakers Games]] (art [[Mujunsha]], development [[Bodogekazoku]]). The entire wiki currently rests on a single source: the [[Eternal Decks Rulebook (4th Edition)|English rulebooks, 4th edition]].\n\n## The game in one paragraph\n\nHumanity's lifespans are shortening, and the [[Explorers]] enter the [[Eternal World]] to find out why. Mechanically, 1–4 players share one [[Game Board]] and must each play a card (or act) every turn or everyone loses — the [[Cycle of Life]]. Cards played to [[The Field]] under interlocking placement rules ([[Common Placement Rules]], per-row [[Field Cards]], accumulating [[Curse of the Eternals|Curses]]) eventually [[Revival|Revive]] sleeping [[Eternals]], whose eight-card [[Eternal Decks]] refill the reviver's dwindling [[Player Deck]]. Curses are broken with [[Jewels]] ([[Jewel Recipes]] spent into [[The River]]), and hidden hands are navigated through [[Communication Discs]] and tightly restricted [[Verbal Discussion]]. Each of six [[Stages]] rebuilds this core into a different game.\n\n## The campaign arc\n\n[[Stage A Nature Star]] (gain four [[Stars]]) teaches the loop → [[Stage B Ghost Town]] introduces [[Keys]] and same-color/same-number Field twists → [[Stage C Labyrinth]] turns the Field into a pattern-matching [[Puzzle Cards|puzzle]] grid → [[Stage D Gate Keeper]] adds a boss with its own turn, [[Skull Cards]], and the [[Gatekeeper Battle]] → [[Stage E Silent]] removes talking and adds hidden [[Task Cards]] → [[Stage F Dragon]] combines everything into a four-objective finale that hatches the [[Dragon]]. After the ending (dragons' reincarnation caused the shortened lifespans; the [[Ouroboros Ring]] links the worlds; the [[Gatekeeper]] — a former Explorer — watches over the return), five [[Advanced Mode]] remixes (A+–E+) carry the story to the \"circulation of eternity\" epilogue in [[Stage E+ Engagement]].\n\n## Design throughlines\n\n- **One engine, many games:** every Stage recombines the same primitives (Field/River/Revival/Curses/Jewels), varying only objectives and communication constraints.\n- **Communication as the real difficulty dial:** from open (indirect) talk in Stage A, to disc-only suggestions, to the near-total silence of Stage E/E+ — and [[Creative Mode]] titles that tune it per player.\n- **Curses as tempo:** every Revival helps a player's deck but restricts the whole team's Field; Jewel economy decides when to pay that debt. D Eternal Curses invert this (beneficial), E Eternal Curses are one-shot shocks.\n- **Timers everywhere:** the [[River Bonus]]/[[Game Over Card]], twelve-lap row structure ([[Laps and Closing Rows]]), and the [[Gatekeeper Deck]] countdown.\n- **Modes:** [[Practice Mode]] and four [[Difficulty Modes]] per Stage; [[Player Count Setups]] for 1–4; [[Solo Play]] with the scored [[Story Mode]] (\"The Alchemist and the Cat\", starring [[The Alchemist]] and the Golems [[Golem Alpha]]/[[Golem Beta]]/[[Golem Gamma]]); [[Creative Mode]] achievements, titles, and custom-Stage design.\n\n## Known gaps and flagged issues\n\nSee the [[Eternal Decks Rulebook (4th Edition)|source page]] for the full list: the Alpha/Beta/Gamma vs \"Alpha, Gamma, Delta\" Golem naming contradiction, the \"Baron's Curse\" typo ([[Barong]]), the not-fully-specified third Stage F hand recipe, unlisted Individual Revival Boards, and untranscribed per-Eternal deck compositions. No FAQ/errata, designer commentary, strategy content, or community material has been ingested yet — those would be natural next sources.\n", "folder": ""}, "Board Locations and Notation": {"md": "# Board Locations and Notation\n\nThe vault's standard way to refer to places on the [[Game Board]] and to cards, so that game states, rules questions, and strategy discussions are unambiguous. Zone names follow the rulebook; coordinates are this wiki's convention.\n\n## Board map\n\n```\n┌────────────────────────────────────────────────────────────────────┐\n│  REVIVAL AREA:   RA1  RA2  RA3  RA4  RA5  RA6  RA7  RA8  RA9       │\n├───────────────┬────────────────────────────────────────────────────┤\n│  JEWEL AREA   │   STAGE CARD AREA        (ETERNAL DECKS logo)      │\n├──────┬────────┴───────────────────────────────────┬────────────────┤\n│ FC-T │  T1  T2  T3  T4 │ T5  T6  T7  ← Eternals   │ 4LB-T (CAMP)   │\n│ FC-M │  M1  M2  M3  M4 │ M5  M6  M7  ← Eternals   │ 4LB-M (Hearts) │\n│ FC-B │  B1  B2  B3  B4 │ B5  B6  B7  ← Eternals   │ 4LB-B (Star)   │\n├──────┴────────────────────────────────┬─────────────────┬──────────┤\n│  RIVER:  Riv1 Riv2 Riv3 Riv4 Riv5     │ RIVER BONUS AREA│  VORTEX  │\n└───────────────────────────────────────┴─────────────────┴──────────┘\n```\n\n## Zone names (rulebook terms — use as-is)\n\n[[Revival Area]] · Jewel Area · Stage Card Area · Field Card Area · [[The Field]] · [[4th Lap Bonus]] Area · [[The River]] (River of Life) · [[River Bonus]] Area · [[Discard Area]] (Vortex) · plus per-Stage overlays (Key/Star Acquisition Areas, GK HP Card, Puzzle Area/Level Cards, Task/Key Area Cards, [[Individual Revival Areas]]).\n\n## Coordinates\n\n- **Field rows:** **T** (top), **M** (middle), **B** (bottom). \"The Mountain row\" is fine casually, but T/M/B is canonical — [[Field Cards]] rotate between laps in Standard+ modes.\n- **Field spaces:** number **left → right from the Field Card**: T1…T7, M1…M7, B1…B7. Space numbers are fixed all game; at setup the three rightmost (x5–x7) hold the sleeping [[Eternals]], and the playable stretch grows as they leave (lap 1: x1–x4 … lap 4: x1–x7). **\"Revival space\"** = the space directly left of the leftmost remaining Eternal (the [[Revival]] trigger; it shifts right each lap).\n- **Field Card slots:** FC-T / FC-M / FC-B.\n- **4th Lap Bonus rows:** 4LB-T (CAMP card) / 4LB-M (Hearts) / 4LB-B (Star).\n- **River:** Riv1…Riv5 left → right (Riv5 triggers the [[River Bonus]]). Since the River has no placement rules, position rarely matters — prefer a count: **\"River 3/5\"** = three cards in the River. Riv1 matters in [[Stage F Dragon]] (the Key Bonus Rare Card's permanent seat).\n- **Revival Area:** RA1…RA9 left → right — matches the rulebook's \"1st/…/9th Eternal in the Revival Area\" used by [[Stars]] and [[Task Cards]].\n- **Gatekeeper HP:** \"GK@14\" = HP disc on 14 ([[Gatekeeper Battle]]).\n\n## Card shorthand\n\n- **Colors** ([[Five Energies]]): **r** red/Passion · **b** blue/Calm · **g** green/Harmony · **y** yellow/Challenge · **p** purple/Inspiration. So **y5** = yellow 5.\n- **[[Two-Color Cards]]:** both halves, active side first — \"rg 4/9\" = red-4 / green-9 side available; \"played as g9\" once oriented.\n- **[[Rare Cards]]:** \"Rare\" (specify \"River Rare\" / \"Key Bonus Rare\" when it matters).\n- **[[Skull Cards]]:** color + skull — \"b-skull\"; **[[White Skull Cards]]:** \"w-skull\".\n- **[[Ability Cards]] / Eternals:** by name — \"the Kraken ability\", \"Revive Skeleton to RA2\".\n\n**Example:** \"Hand: r3, y5, rg 2/7. Mountain on FC-T, lap 2 (T6–T7 Eternals). I play y5 to T5 → Revive [[Mermaid]] to RA3; her deck under my [[Player Deck]].\"\n\n## Caveats\n\n- **Row length (7 spaces) is inferred, not printed:** the rulebook diagrams and the Mermaid example (four cards completed a lap-1 row) imply 4 playable + 3 Eternal spaces, but no space count appears in prose. **Verify against the physical board** and correct this page if it differs.\n- This notation is a convention for wiki/discussion use. Between players at the table, [[Verbal Discussion]] restrictions still apply — saying \"I have y5 for T5\" about your own hand is illegal in-game.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]] (board diagram p. 07; revival example p. 11; lap examples p. 13)\n", "folder": "questions"}, "Playing with Claude as a Second Player": {"md": "# Playing with Claude as a Second Player\n\nProtocol for playing *Eternal Decks* with the vault's LLM as a full second seat. The game runs on hidden hands + restricted [[Verbal Discussion]] — and with the **blind-photo technique** below, true two-way hidden information is achievable: the human never sees the AI's hand, the AI never sees the human's.\n\n## Primary mode: full hidden hands via blind photos\n\n- **The AI's hand** is kept as a face-down row on the table, positions numbered **1, 2, 3… from the human's left**. Newly drawn cards go face down on the **right** end.\n- **Blind photo:** the human fans the cards face-up toward the camera *while looking away*, photographs them, and drops the image into the conversation **without viewing it** (beware thumbnails/previews). The AI reads its hand silently and never states its contents (per Verbal Discussion; \"I have a Rare card\"-class statements remain legal).\n- **The human's hand** stays hidden as normal — they report only public information.\n- Both seats now genuinely play the communication game: [[Communication Discs]] (the AI declares its placements; the human moves the tokens) plus legal table-talk in both directions.\n\n## Turn loop\n\n1. **Setup:** official 2-player rules ([[Player Count Setups]]): two colors per seat, 7-card [[Player Deck|Player Decks]]. The human does all shuffling, d4 rolls, and physical execution. First game: [[Stage A Nature Star]] Beginner.\n2. **Human turn:** act physically, report public info in [[Board Locations and Notation]] — \"Played g4 to T2, drew 1. River 2/5.\" — plus disc moves.\n3. **AI turn:** the AI instructs by hand position — \"flip position 2, play to T4\" / \"flip 1 and 3 to the River: two-same-number [[Jewel Recipes|recipe]]\" / \"give position 1 to you (spend a [[Hearts|Heart]]).\" The human flips, executes, and reports the now-public card (\"y5 at T4\").\n4. **Draws:** the human blind-photos new cards (or the whole hand) after refills — especially after a [[Revival]] floods the deck.\n5. **Position tracking:** when a card leaves the AI's hand, the rest shift left; the AI maintains the mapping. Re-photo whenever drift is suspected.\n6. **Gifts to the AI:** the giver legitimately knows the card — just say what it was.\n7. **State keeping:** the AI maintains and periodically restates a compact state block (rows, [[Revival Area]], active [[Curse of the Eternals|Curses]], [[Jewels]] used, River count, Hearts, [[Stars]]/[[Keys]], deck counts); board photos are the preferred substitute for typing large states. The AI doubles as rules referee ([[Common Placement Rules]], [[Field Cards]], Curses).\n\n## House rules for the medium\n\n- **Misread contingency:** if the AI misreads a photo and its instruction is illegal once flipped, the card stays revealed (an accidental table reveal), returns to hand, and the AI chooses a different action.\n- **Accidental peek:** if the human sees the AI's hand, say so and play on — the game degrades to the asymmetric open-hand mode below, not to a stop.\n- [[Discard Area]] checks: the AI announces the specific card it is looking for, per the recommended limits.\n\n## Fallback modes\n\n- **Asymmetric open hand:** the human reads the AI its hand aloud (human's own hand stays hidden). Sanctioned by precedent — official [[Solo Play]] lays all Golem hands face up. Simpler logistics, halves the deduction.\n- **Full open (\"solo-style\"):** both hands open; co-op puzzle-solving, good for learning Stages.\n- Stage E's silence translates naturally (legal hints stop until Stars unlock them; discs and blind photos carry on).\n\nSource: protocol built on [[Eternal Decks Rulebook (4th Edition)]] (2-player setup, Solo Play open hands, Verbal Discussion, hard-mode suggestion) and [[Board Locations and Notation]].\n", "folder": "questions"}, "Eternal Decks Rulebook (4th Edition)": {"md": "# Eternal Decks Rulebook (4th Edition)\n\n**Type:** Official rulebook (primary source for this wiki)\n**File:** `raw/EternalDecks_EN_Rulebooks_4th_2026_0622.pdf` (60 pages)\n**Publisher:** [[Tricktakers Games]] (© 2025)\n**Game design:** [[Hiroken]] · **Artwork:** [[Mujunsha]] (Tokyo) · **Development:** [[Bodogekazoku]]\n**English rulebook editor:** [[Ryan Campbell]] · **Promotional video:** [[Himitsuri]] · **Special thanks:** Lee Gianou / [[Portland Game Collective]]\n**Edition:** The filename indicates a 4th edition/printing dated 2026-06-22. The credits page carries a 2025 copyright.\n\n## What this source is\n\nThe complete English rules for *Eternal Decks*, a cooperative card game system by [[Hiroken]]. The PDF bundles **two rulebooks**:\n\n1. **Basic Rulebook** (pages 01–22 + credits) — component list, story, the core [[Game Board]] and card system, and a full teach of [[Stage A Nature Star]] in Beginner Mode, plus [[Communication Discs]], [[Practice Mode]], [[Player Count Setups]], and [[Difficulty Modes]].\n2. **Stage Description rulebook** (pages 01–33 + reference card page) — the Stage Setup Table for all [[Difficulty Modes]], full rules for [[Stage B Ghost Town]], [[Stage C Labyrinth]], [[Stage D Gate Keeper]], [[Stage E Silent]], and [[Stage F Dragon]]; the five [[Advanced Mode]] stages (A+–E+); [[Solo Play]] (Basic and [[Story Mode]]); and [[Creative Mode]] achievements and titles.\n\n## Core content extracted\n\n- **Premise:** Humanity's lifespans are shortening; the [[Explorers]] journey to the [[Eternal World]] and meet the [[Eternals]] to solve the mystery of life. See [[Stages]] for the six-part campaign arc, ending with the [[Dragon]]'s resurrection and the revelation that the [[Ouroboros Ring]] connects the two worlds.\n- **System:** a cooperative \"game system\" where each Stage is a different game built on shared mechanics — the [[Cycle of Life]] (you must act every turn or everyone loses), playing [[Number Cards]] to [[The Field]] under [[Common Placement Rules]] and per-row [[Field Cards]], [[Revival]] of Eternals to refill your [[Player Deck]] with their [[Eternal Decks]], [[Curse of the Eternals|Curses]], [[Jewels]] via [[Jewel Recipes]] played to [[The River]], [[Stars]] (Stage A win) and [[Keys]] (Stage B–F win), [[Hearts]], [[Communication Discs]], and restricted [[Verbal Discussion]].\n- **Card types:** [[Number Cards]] in the [[Five Energies]], [[Two-Color Cards]], [[Rare Cards]], [[Ability Cards]], [[Skull Cards]] (Stage D+), [[White Skull Cards]], [[Purple Star Cards]], [[River Rare Cards]], [[Puzzle Cards]], [[Task Cards]], and the [[Game Over Card]].\n- **Eternals:** 24 in all — see [[Eternals]] for the full family structure (A/B/C/D/E families, the three solo [[Golem Alpha|Golems]], and the [[Dragon]]).\n- **Modes:** [[Practice Mode]], four [[Difficulty Modes]] (Beginner/Standard/Expert/Pro), [[Player Count Setups]] for 1–4 players, [[Advanced Mode]] (A+–E+), [[Solo Play]] with [[Story Mode]] (\"The Alchemist and the Cat\"), and [[Creative Mode]].\n\n## Open questions and flagged inconsistencies\n\n- **Golem naming contradiction:** the Basic Rulebook's [[Practice Mode]] section says to set up \"the Alpha, Gamma, and Delta Golems,\" while [[Solo Play]] names the three Golems Alpha, Beta, and Gamma (and [[Story Mode]] assigns them red/green/yellow). One of the two is presumably a misprint; the wiki follows Alpha/Beta/Gamma.\n- **\"Baron's Curse\":** the Gatekeeper's Turn page refers to \"Baron's Curse\" — evidently a typo for [[Barong]].\n- **Stage F hand recipes:** [[Stage F Dragon]] limits hand-generated Jewels to three recipes shown on its Jewel Area Card. The rulebook text confirms \"three cards of the same number\" and \"1/5/9\" are among them; the third is not explicitly named in prose (the card image suggests a three-card color recipe).\n- **Individual Revival Boards** (used in Stage F and Solo Play) are not itemized by that name in the component list.\n- **Per-Eternal deck compositions** are printed on each Eternal card but are not transcribed in rulebook prose; only the [[Phoenix]] deck (3/6/6/7/8/8/9 + Ability Card) is shown as a worked example.\n- The contents of the 2 Ability Aid Cards and 4 Player Aid Cards are not detailed in the rulebook.\n\n## Component list (from pages 01–02)\n\n24 Eternals · 128 Eternals Cards (16 decks × 8) · 40 [[Random Deck|Random Cards]] · 20 [[Starting Decks|Starting Cards]] (4 decks × 5) · 16 [[Field Cards]] · 8 [[Communication Discs]] · 12 [[Jewels]] · 6 [[Stars]] · 3 [[Hearts]] · 1 four-sided die · 4 [[Keys]] · 2 Gatekeeper Discs · 4 [[River Rare Cards]] · 2 [[Game Over Card|Game Over Cards]] · 9 [[Purple Star Cards]] · 16 [[Puzzle Cards]] · 16 [[Gatekeeper Deck|Gatekeeper Cards]] (2 decks × 8) · 4 [[White Skull Cards|White Skull Star Cards]] · 16 [[Task Cards]] · 11 Stage Cards · 2 Ability Aid Cards · 4 Player Aid Cards · 5 GK Player Cards · 2 Key Bonus Cards · 1 GK Attack Card · 2 English + 2 Japanese rulebooks · 1 [[Game Board]]\n", "folder": "sources"}}, "nav": [{"title": "Core pages", "groups": [{"title": "", "items": [{"links": ["overview"]}, {"links": ["log"]}]}]}, {"title": "Sources", "groups": [{"title": "", "items": [{"links": ["Eternal Decks Rulebook (4th Edition)"]}]}]}, {"title": "Concepts", "groups": [{"title": "Core system", "items": [{"links": ["Cycle of Life"]}, {"links": ["Taking a Turn"]}, {"links": ["Winning and Losing"]}, {"links": ["Stages"]}, {"links": ["Game Board"]}]}, {"title": "Cards", "items": [{"links": ["Number Cards"]}, {"links": ["Five Energies"]}, {"links": ["Two-Color Cards"]}, {"links": ["Rare Cards"]}, {"links": ["Ability Cards"]}, {"links": ["Skull Cards"]}, {"links": ["White Skull Cards"]}, {"links": ["Purple Star Cards"]}, {"links": ["Puzzle Cards"]}, {"links": ["Task Cards"]}, {"links": ["Game Over Card"]}, {"links": ["River Rare Cards"]}]}, {"title": "Decks", "items": [{"links": ["Starting Decks"]}, {"links": ["Player Deck"]}, {"links": ["Eternal Decks"]}, {"links": ["Random Deck"]}, {"links": ["Gatekeeper Deck"]}]}, {"title": "Board zones and placement", "items": [{"links": ["The Field"]}, {"links": ["Field Cards"]}, {"links": ["Common Placement Rules"]}, {"links": ["The River"]}, {"links": ["River Bonus"]}, {"links": ["Discard Area"]}, {"links": ["Revival Area"]}, {"links": ["Laps and Closing Rows"]}, {"links": ["4th Lap Bonus"]}]}, {"title": "Core mechanics", "items": [{"links": ["Revival"]}, {"links": ["Curse of the Eternals"]}, {"links": ["Jewels"]}, {"links": ["Jewel Recipes"]}, {"links": ["Stars"]}, {"links": ["Star Bonus"]}, {"links": ["Keys"]}, {"links": ["Hearts"]}, {"links": ["Communication Discs"]}, {"links": ["Verbal Discussion"]}, {"links": ["Gatekeeper Battle"]}, {"links": ["Individual Revival Areas"]}, {"links": ["Dragon Deck"]}]}, {"title": "Stages", "items": [{"links": ["Stage A Nature Star"]}, {"links": ["Stage B Ghost Town"]}, {"links": ["Stage C Labyrinth"]}, {"links": ["Stage D Gate Keeper"]}, {"links": ["Stage E Silent"]}, {"links": ["Stage F Dragon"]}, {"links": ["Stage A+ Advance"]}, {"links": ["Stage B+ Backup"]}, {"links": ["Stage C+ Combination"]}, {"links": ["Stage D+ Destiny"]}, {"links": ["Stage E+ Engagement"]}]}, {"title": "Modes", "items": [{"links": ["Difficulty Modes"]}, {"links": ["Player Count Setups"]}, {"links": ["Practice Mode"]}, {"links": ["Advanced Mode"]}, {"links": ["Solo Play"]}, {"links": ["Story Mode"]}, {"links": ["Creative Mode"]}]}]}, {"title": "Entities", "groups": [{"title": "The Eternals", "items": [{"links": ["Eternals"]}, {"label": "A Eternals", "links": ["Phoenix", "Mermaid", "King", "Fairy"]}, {"label": "B Eternals", "links": ["Ghost", "Skeleton", "Witch", "Vampire"]}, {"label": "C Eternals", "links": ["Medusa", "Minotaur", "Kraken", "Mummy"]}, {"label": "D Eternals", "links": ["Pegasus", "Barong", "Jinn", "Kyubi"]}, {"label": "E Eternals", "links": ["Yeti", "Kappa", "Cyclops", "Golem"]}, {"label": "Solo Golems", "links": ["Golem Alpha", "Golem Beta", "Golem Gamma"]}, {"links": ["Dragon"]}]}, {"title": "Characters and places", "items": [{"links": ["Gatekeeper"]}, {"links": ["Explorers"]}, {"links": ["The Alchemist"]}, {"links": ["Eternal World"]}, {"links": ["Ouroboros Ring"]}]}, {"title": "Field Cards", "items": [{"label": "General", "links": ["Camp", "Forest", "Lake", "Grassland", "Mountain", "Cave", "Riverside", "Valley", "Desert", "Swamp"]}, {"label": "Ghost Town", "links": ["Castle", "Fog", "Lost Forest", "Festival"]}, {"links": ["Labyrinth (Field Card)"]}]}, {"title": "People and organizations", "items": [{"links": ["Hiroken"]}, {"links": ["Mujunsha"]}, {"links": ["Bodogekazoku"]}, {"links": ["Tricktakers Games"]}, {"links": ["Ryan Campbell"]}, {"links": ["Himitsuri"]}, {"links": ["Portland Game Collective"]}]}]}, {"title": "Questions and analyses", "groups": [{"title": "", "items": [{"links": ["Board Locations and Notation"]}, {"links": ["Playing with Claude as a Second Player"]}]}]}]};

// Case-insensitive lookup so [[overview]] and [[Overview]] both resolve.
const byLower = Object.fromEntries(Object.keys(pages).map(n => [n.toLowerCase(), n]));
const resolve = name => byLower[name.trim().toLowerCase()];
const title = name => name[0].toUpperCase() + name.slice(1);   // "overview" -> "Overview"
const href = name => "#/" + encodeURIComponent(name);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LINK = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;

// Backlinks: which pages link to each page.
const backlinks = {};
for (const [name, p] of Object.entries(pages)) {
  for (const m of p.md.matchAll(LINK)) {
    const t = resolve(m[1]);
    if (t && t !== name) (backlinks[t] ||= new Set()).add(name);
  }
}

// Reading order for prev/next = sidebar order.
const order = [];
nav.forEach(s => s.groups.forEach(g => g.items.forEach(i => i.links.forEach(l => {
  const n = resolve(l); if (n && !order.includes(n)) order.push(n);
}))));

marked.use({ gfm: true, breaks: false });

function toHtml(md) {
  // Wiki links -> anchors before markdown parsing, so the "|" alias never splits table cells.
  const pre = md.replace(LINK, (_, target, alias) => {
    const t = resolve(target), text = esc((alias || target).trim());
    return t ? `<a href="${href(t)}">${text}</a>` : `<a class="missing" title="No page yet">${text}</a>`;
  });
  return marked.parse(pre);
}

// Colour the Five Energies and ✦ difficulty stars in text (not inside code).
const ENERGY = /\b(red|passion|blue|calm|green|harmony|yellow|challenge|purple|inspiration)\b|(✦+)/gi;
const COLOR_OF = { passion: "red", calm: "blue", harmony: "green", challenge: "yellow", inspiration: "purple" };
function colourise(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest("pre, code, .results") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  const HAS = new RegExp(ENERGY.source, "i");
  while (walker.nextNode()) if (HAS.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const span = document.createElement("span");
    span.innerHTML = esc(node.nodeValue).replace(ENERGY, (m, word, stars) => {
      if (stars) return `<span class="e-star">${m}</span>`;
      const w = word.toLowerCase();
      return `<span class="e-${COLOR_OF[w] || w}">${m}</span>`;
    });
    node.replaceWith(...span.childNodes);
  }
}

function buildNav() {
  const tree = document.getElementById("navtree");
  tree.innerHTML = nav.map((s, i) => `
    <details class="navsec" ${i < 2 || s.title === "Concepts" ? "open" : ""}>
      <summary>${esc(s.title)}</summary>
      ${s.groups.map(g => `
        ${g.title ? `<div class="navgrp">${esc(g.title)}</div>` : ""}
        <ul class="navlist">
          ${g.items.map(it => {
            const links = it.links.map(l => resolve(l)).filter(Boolean)
              .map(n => `<a href="${href(n)}" data-page="${esc(n)}">${esc(title(n))}</a>`).join("");
            return it.label ? `<li><span class="lbl">${esc(it.label)}</span><span class="row">${links}</span></li>` : `<li>${links}</li>`;
          }).join("")}
        </ul>`).join("")}
    </details>`).join("");
}

function showPage(name) {
  const p = pages[name];
  const folder = p.folder || "core";
  document.getElementById("crumbs").innerHTML =
    `<span class="chip ${folder}">${folder === "core" ? "Wiki" : folder[0].toUpperCase() + folder.slice(1, -1)}</span>`;
  const art = document.getElementById("article");
  art.innerHTML = toHtml(p.md);
  art.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "tablewrap"; t.replaceWith(w); w.appendChild(t);
  });
  colourise(art);

  const bl = [...(backlinks[name] || [])].sort();
  const i = order.indexOf(name);
  const prev = i > 0 ? order[i - 1] : null, next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
  document.getElementById("extras").innerHTML = `
    ${bl.length ? `<section class="backlinks"><h4>Linked from ${bl.length} page${bl.length > 1 ? "s" : ""}</h4>
      <div>${bl.map(n => `<a class="btn" href="${href(n)}">${esc(title(n))}</a>`).join("")}</div></section>` : ""}
    <div class="pager">
      ${prev ? `<a class="btn" href="${href(prev)}">← ${esc(title(prev))}</a>` : "<span></span>"}
      ${next ? `<a class="btn on" href="${href(next)}">${esc(title(next))} →</a>` : ""}
    </div>`;

  document.title = `${title(name)} · Eternal Decks Rulebook`;
  document.querySelectorAll("#navtree a").forEach(a => {
    const on = a.dataset.page === name;
    a.classList.toggle("on", on);
    if (on) { a.closest("details").open = true; a.scrollIntoView({ block: "nearest" }); }
  });
}

function showSearch(q) {
  const needle = q.trim().toLowerCase();
  const plain = md => md.replace(LINK, (_, t, a) => a || t).replace(/[#*`|>_-]+/g, " ").replace(/\s+/g, " ");
  const hits = Object.entries(pages).map(([name, p]) => {
    const text = plain(p.md), lower = text.toLowerCase();
    const score = (name.toLowerCase().includes(needle) ? 100 : 0) + lower.split(needle).length - 1;
    return { name, text, lower, score };
  }).filter(h => h.score > 0).sort((a, b) => b.score - a.score).slice(0, 40);
  const snippet = h => {
    const at = h.lower.indexOf(needle);
    if (at < 0) return esc(h.text.slice(0, 140)) + "…";
    const s = Math.max(0, at - 60);
    return (s ? "…" : "") + esc(h.text.slice(s, at)) + `<mark>${esc(h.text.slice(at, at + needle.length))}</mark>` +
      esc(h.text.slice(at + needle.length, at + needle.length + 90)) + "…";
  };
  document.getElementById("crumbs").innerHTML = `<span class="chip questions">Search</span>`;
  document.getElementById("article").innerHTML = `<h1>“${esc(q)}”</h1>` + (hits.length
    ? `<p>${hits.length} page${hits.length > 1 ? "s" : ""} found.</p><ul class="results">${hits.map(h =>
        `<li><a href="${href(h.name)}">${esc(title(h.name))}</a><p>${snippet(h)}</p></li>`).join("")}</ul>`
    : `<p>No pages mention that.</p>`);
  document.getElementById("extras").innerHTML = "";
}

function route() {
  const name = resolve(decodeURIComponent(location.hash.replace(/^#\/?/, "")) || "overview") || "overview";
  showPage(name);
  window.scrollTo({ top: 0 });
  document.getElementById("nav").classList.remove("open");
  document.getElementById("menu-toggle").setAttribute("aria-expanded", "false");
}

buildNav();
window.addEventListener("hashchange", route);
let timer;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(timer);
  const q = e.target.value;
  timer = setTimeout(() => q.trim().length > 1 ? showSearch(q) : route(), 150);
});
document.getElementById("menu-toggle").addEventListener("click", e => {
  const open = document.getElementById("nav").classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", open);
});
route();
</script>
