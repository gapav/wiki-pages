-played card).\n\n## Sequel\n\n[[Stage C+ Combination]]: the \"Giant Puzzle\" — both puzzle cards of each level must be completed as a left-to-right set, and Rares/Minotaur/CAMP are banned from puzzles.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stage C+ Combination": {"md": "# Stage C+ Combination\n\n**[[Advanced Mode]] Stage C.** \"The Labyrinth has become abnormally complicated. Use the Explorers' powers to complete the giant puzzle and restore the Labyrinth to its original form.\"\n\n## Changes from [[Stage C Labyrinth]]\n\n- **Giant Puzzle:** to advance a level, **both [[Puzzle Cards]] of that level must be completed as a set** on [[The Field]] — not just one. The two patterns must appear **left to right** as shown on the Puzzle Area Card (space between them is fine, but they cannot be swapped).\n- **No wildcards:** [[Rare Cards]], the [[Minotaur]] Ability Card, and the CAMP [[4th Lap Bonus]] Card **cannot** be used to complete any puzzle. [[Two-Color Cards]] remain legal, and one card can serve both puzzles at once where the patterns overlap.\n\nSetup and win condition are otherwise unchanged (four levels → four [[Keys]]). The [[Creative Mode]] *Beautiful Puzzle* achievement (complete every puzzle without wildcards) is this Stage's training run.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stage D Gate Keeper": {"md": "# Stage D Gate Keeper\n\n**Stage D — \"Fight the Gatekeeper.\"** A large gate, blocked by an even larger figure. Work with the Positive [[Eternals]] to defeat the [[Gatekeeper]].\n\n## Win condition\n\nReduce the Gatekeeper's **HP (20) to 0**. Every 5 damage (HP marks 15/10/5/0) earns a [[Keys|Key]]; after each Key the HP resets to 20 and leftover damage is ignored. Damage is dealt by covering [[Skull Cards]] with matching-color [[Number Cards]] — see [[Gatekeeper Battle]].\n\n## Setup\n\n- 3 Stage Cards: Star Stage Card (+ four [[White Skull Cards]]), GK HP Card, GK Deck Card.\n- 2 GK Discs: one on the 20-HP space, one on the 1st space of the top row (marking where the GK's next Skull lands).\n- Four Keys on the 15/10/5/0 HP spaces; [[Mountain]] in the top row for all four laps.\n- **[[Gatekeeper Deck]]:** Game Over Card at the bottom, purple-backed 2nd Half Deck shuffled on top, white-backed 1st Half Deck shuffled on top of that (2p/4p remove two 3-player-only cards → 14 cards).\n- Three random D Eternals — [[Pegasus]], [[Barong]], [[Jinn]], [[Kyubi]] minus a d4 removal — in the top row. Their [[Curse of the Eternals|Curses]] are **positive**, and each deck carries three Skull Cards.\n- Starting player: red, else blue, else green.\n\n## Stage rules\n\n- **The GK takes a turn after the last player** (2p: after each player's two turns), flipping its top deck card — Skull to the Field or Ability resolved ([[Gatekeeper Battle]]).\n- **After the GK deck's last card, the next card required is the [[Game Over Card]] — everyone loses**: the deck is the Stage timer.\n- [[Star Bonus]]: a [[White Skull Cards|White Skull Card]] to hand.\n\n## Sequels\n\n[[Stage D+ Destiny]] reveals the GK's true identity — a former [[Explorers|Explorer]] — and adds the Finisher, Counter, and GK Attack rules. The GK also crashes [[Stage B+ Backup]] and referees [[Stage F Dragon]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stage D+ Destiny": {"md": "# Stage D+ Destiny\n\n**[[Advanced Mode]] Stage D.** \"After encountering the Gatekeeper a third time, you learn of its true identity — a former [[Explorers|Explorer]] who visited the Eternal World! Let's evoke human emotions by colliding with the emotional energy of an Explorer.\"\n\n## Changes from [[Stage D Gate Keeper]]\n\n- **Key placement:** one [[Keys|Key]] on 10 HP, one on 5 HP, two on the 0 HP space.\n- **The Finisher:** when a Key is within reach, **the player whose color matches the next Key must personally deal the damage that claims it**. (3-player: anyone may finish the unused color; 2-player: each player covers their two colors.)\n- **Gatekeeper Counter:** the Finisher should land the GK Disc exactly on the Key. For every point of damage beyond it, the Finisher **discards one card from their deck, face up** (deck only — an empty deck discards nothing). If a *non*-Finisher's damage crosses a Key, no Key is gained: the Disc stops one space short and the Finisher must still land the final point. **The last Key demands exact damage** — overshooting parks the Disc one space short for a one-damage finish next time.\n- **Gatekeeper Attack:** the GK Attack Card sits face down on the Key Acquisition Area with the d4. **Each Key placed there triggers an attack** — roll the d4:\n  1. Everyone discards their deck's top card ([[Yeti]]'s Curse).\n  2. Two Field cards discarded ([[Cyclops]]'s Curse).\n  3. One [[River Rare Cards|River Rare]] discarded ([[Kappa]]'s Curse).\n  4. A [[Jewels|Jewel]] returns from a Revived Eternal to the box ([[Golem]]'s Curse, jewel unrecoverable).\n\nThe [[Creative Mode]] *Perfect Finisher* / *All Finisher* achievements rehearse these rules in base Stage D.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stage E Silent": {"md": "# Stage E Silent\n\n**Stage E — \"A Silent Trial.\"** Beyond the great gate lies a silent space that seems to go on forever; in the distance, the faint requests of the Random [[Eternals]].\n\n## The silence\n\n**Verbal discussion is prohibited** (rules clarifications are okay), and [[Communication Discs]] cannot be used until unlocked. [[Stars]] loosen the gag progressively ([[Star Bonus]]): 1st Star — discs unlocked; 2nd — [[Task Cards]] revealed (no talking about them); 3rd–5th — all hands revealed with open discussion until end of turn (the [[Ghost]] effect; playing an A Eternal [[Ability Cards|Ability Card]] does the same).\n\n## Win condition\n\nAll players complete their required **[[Task Cards|Tasks]]**. Completing a task reveals it and advances the matching-color [[Keys|Key]] one space; two tasks bring a Key home to the Key Acquisition Area. (3p/2p variants continue drawing from the General Task Deck to advance the unused Key colors — see [[Task Cards]].)\n\n## Setup\n\n- 3 Stage Cards: Star Bonus Card (with each player's discs), Task Area Card, Key Area Card (four Keys on its leftmost spaces).\n- [[Mountain]] top row, all four laps.\n- **Three random E Eternals** — [[Yeti]], [[Kappa]], [[Cyclops]], [[Golem]] minus a d4 removal — dealt eight cards each from the [[Random Deck]] (rest removed). Their [[Curse of the Eternals|Curses]] fire **once, on Revival**, then go dormant.\n- Tasks: each player gets a Starting Task (own color) + one 6/7/8/9 Task + one General Task (4p; 3p/2p build a General Task Deck).\n- Starting player: red, else blue, else green. Five Stars; stars placed on the Star Bonus Card top-to-bottom, left-to-right.\n\n## Sequel\n\n[[Stage E+ Engagement]] — one disc each, no gestures, ordered win requirements, and the campaign's epilogue.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stage E+ Engagement": {"md": "# Stage E+ Engagement\n\n**[[Advanced Mode]] Stage E — the final Stage of the story.** \"To return to their original world, the Explorers must pass through a silent space. The final test will be to understand the feelings of their companions.\"\n\n## Changes from [[Stage E Silent]]\n\n- **Star effects:** 1st [[Stars|Star]] — each player gets their **single** [[Communication Discs|disc]]; 2nd & 3rd — recover up to three [[Hearts]]; 4th — reveal all hands ([[Ghost]] effect). One disc is placed on the Stage E Star Bonus Card at setup. (A Eternals normally sit out; if used, their Ability recovers one Heart.)\n- **Disc restrictions:** one disc each (the other pins your Starting Task); discs may only be placed on [[The Field]] or [[The River]]; no using others' discs; **no gestures**.\n- **Eternals:** the four [[Rare Cards]] are removed from the [[Random Deck]] before dealing the E decks; using [[Ghost]] is legal but discouraged.\n- **Tasks:** the \"Give a Jewel, 7th–9th Eternal\" and \"Have a Rare Card\" General [[Task Cards]] are removed. **Your Tasks (except the Starting Task) must be completed by the player whose turn is before yours** — the ultimate mind-reading test. Completing your own Starting Task does not advance your [[Keys|Key]].\n- **Ordered win:** (1) advance all four Keys to the Key Acquisition Area, **then** (2) gain the 4th Star, at which point everyone reveals hands and **every player must be able to complete their Starting Task** (reveal a 1–5 of their color; [[Two-Color Cards]] okay, Rares not). Gaining the 4th Star early, or any player failing their Starting Task, loses the game immediately.\n\n## Epilogue — \"Circulation of Eternity\"\n\n\"The last card you hold in your hand was the first card you received after coming to this world… Just as the sun that sets today will rise again tomorrow, the chain of life continues uninterrupted. May this great cycle continue eternally.\" Clearing E+ unlocks the **GK Player Deck** (five purple GK Player Cards) as an alternative [[Starting Decks|starting deck]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stage F Dragon": {"md": "# Stage F Dragon\n\n**Stage F — \"The Resurrection of the Dragon.\"** The mystery of the shortened lifespans is tied to the [[Dragon]]'s egg. The final Stage of the base campaign — one configuration, no [[Difficulty Modes]]; the rulebook advises clearing A–E first.\n\n## Win condition\n\nGain all four [[Keys]], each from a **different objective**:\n\n1. Generate **all three hand [[Jewel Recipes]]** (the Stage F Jewel Area Card lists only three; \"three of the same number\" and 1/5/9 are confirmed among them — 1/5/9 grants no [[Stars|Star]] here).\n2. Place **all four [[Communication Discs|player-color discs]]** on the River & Discs Card via [[Individual Revival Areas]] (the GK Disc, earned from the River, substitutes as any color).\n3. Have **five 5s and/or 7s in [[The River]]**.\n4. Gain **four [[Stars]]** (real tokens on the Star Bonus Card; A-Ability [[Star Bonus]]es don't count toward this).\n\nEach Key also grants a chosen **Key Bonus** (the last one is not activated): the Key Bonus Rare Card (permanent leftmost River fixture; [[Skull Cards]] may now enter the River and fuel recipes); an ability card to hand + recover all [[Hearts]]; instantly turn any Field into [[Camp]]; or a [[River Rare Cards|River Rare]] into the [[River Bonus]] Area. After the 4th Key, the Key Bonus Area Card reveals the \"path back to your original world.\"\n\n## Setup highlights\n\n- 4 Stage Cards (Jewel Area, River & Discs, Star Bonus with the face-up [[Gatekeeper Deck|GK 2nd Half Deck]], Key Bonus Area), 4 Keys, 7 [[Jewels]], 1 Star, 1 GK Disc.\n- **14 [[Field Cards]]:** [[Mountain]] top (all laps); middle: four random face-down (top face up); bottom: the four Ghost Town cards under four random cards.\n- **Nine Eternals:** one random A, B, and C Eternal per row.\n- **The egg stack:** the shuffled [[Random Deck]] in the 4th Lap Bonus Area, under the four face-down E Eternals, the Dragon Egg, and a Star.\n- **Players:** no [[Starting Decks]] — each takes their color's D Eternal ([[Pegasus]] red, [[Barong]] blue, [[Jinn]] green, [[Kyubi]] yellow) plus its 8-card deck as their [[Player Deck]] and an Individual Revival Board. **A D Eternal's positive Curse benefits only its assigned player.**\n\n## Stage mechanics\n\n- **River engine:** [[Jewels]] can be generated from the River's five cards (four River recipes); specific River contents grant a Key / Star / the GK Disc ([[The River]]).\n- **Star Bonus:** each Star adds a chosen GK card to hand (the GK \"XXX\" Jewel ability may give its Jewel to *any* Eternal here; \"Shuffle\" redeals all hands starting with the next player).\n- **[[Dragon Deck]]:** the bottom row's 4th clear Revives the Dragon; the Dragon caps the [[Game Over Card]] (no more River-Bonus loss), and the four E Eternals emerge in the bottom row with fresh [[Random Deck]] decks.\n\nThe ending: the shortened lifespans were caused by the reincarnation of dragons; the two worlds connect through the [[Ouroboros Ring]], and under the [[Gatekeeper]]'s watchful eye the [[Explorers]] return home. The story continues in [[Advanced Mode]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stages": {"md": "# Stages\n\n*Eternal Decks* is \"a cooperative game system where each Stage is a different game\" sharing the same core: playing cards to the [[Game Board]] to refill decks ([[Cycle of Life]]) while pursuing Stage objectives. The six Stages form a campaign following the [[Explorers]] through the [[Eternal World]].\n\n| Stage | Title | Objective |\n|---|---|---|\n| A | [[Stage A Nature Star]] — *First Encounter with the Eternals* | Gain four [[Stars]] |\n| B | [[Stage B Ghost Town]] — *The Key to Solving the Secrets Within* | Revive the four B Eternals ([[Keys]]) |\n| C | [[Stage C Labyrinth]] — *Escape from the Labyrinth* | Complete four [[Puzzle Cards|Puzzles]] |\n| D | [[Stage D Gate Keeper]] — *Fight the Gatekeeper* | Reduce the [[Gatekeeper]]'s HP to 0 |\n| E | [[Stage E Silent]] — *A Silent Trial* | Each player completes their [[Task Cards|Tasks]] |\n| F | [[Stage F Dragon]] — *The Resurrection of the Dragon* | Various objectives; revive the [[Dragon]] |\n\nStages A–E have four [[Difficulty Modes]]; the rulebook recommends clearing A–E before attempting F. After F, the five [[Advanced Mode]] stages (A+ [[Stage A+ Advance|Advance]], B+ [[Stage B+ Backup|Backup]], C+ [[Stage C+ Combination|Combination]], D+ [[Stage D+ Destiny|Destiny]], E+ [[Stage E+ Engagement|Engagement]]) remix each Stage with the campaign's true ending. [[Practice Mode]] precedes everything; [[Solo Play]]'s [[Story Mode]] chains A–E; [[Creative Mode]] invites custom Stages.\n\nWin conditions per Stage sit in [[Winning and Losing]]; per-Stage rewards in [[Star Bonus]] and [[Keys]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Star Bonus": {"md": "# Star Bonus\n\nFrom [[Stage B Ghost Town]] onward, gaining a [[Stars|Star]] immediately grants a Stage-specific bonus. Playing an A Eternal [[Ability Cards|Ability Card]] also triggers the current Star Bonus (without granting a Star token).\n\n| Stage | Star Bonus |\n|---|---|\n| [[Stage B Ghost Town]] | Add any one remaining [[Purple Star Cards|Purple Star Card]] (1–9) to your hand |\n| [[Stage C Labyrinth]] | *(Star Stage Card with Purple Star Cards is set up as in B)* |\n| [[Stage D Gate Keeper]] | Add one [[White Skull Cards|White Skull Card]] to your hand (four exist) |\n| [[Stage E Silent]] | Progressive unlocks: 1st Star — [[Communication Discs]]; 2nd — reveal [[Task Cards]]; 3rd–5th — reveal all hands + discussion until end of turn |\n| [[Stage F Dragon]] | Add one [[Gatekeeper Deck|GK card]] of your choice to your hand |\n| [[Stage E+ Engagement]] | 1st — single disc; 2nd/3rd — recover up to three [[Hearts]]; 4th — reveal all hands |\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Stars": {"md": "# Stars\n\nSix star tokens. Stars are the win currency of [[Stage A Nature Star]] (**gain four to win**) and a supporting objective in every later Stage (from Stage B onward, four Stars grant rewards via the [[Star Bonus]] and, in [[Stage F Dragon]], a [[Keys|Key]]).\n\n## The six Stage A Stars\n\n1. Give [[Jewels]] to the 1st, 2nd, and 3rd [[Eternals]] in the [[Revival Area]].\n2. Give Jewels to the 4th, 5th, and 6th Eternals.\n3. [[Revival|Revive]] all nine Eternals (placing the 9th; no Jewels needed).\n4. Generate a Jewel with the 1/5/9 recipe (Jewel + Star together).\n5. Complete the 4th lap on the bottom row ([[4th Lap Bonus]]).\n6. Play all three A Eternal [[Ability Cards]] to the Stage Card Area (Stage A only).\n\n## From Stage B onward\n\n- Five Stars are prepared instead of six (the Stage-Card-Area Star is dropped).\n- Each Star gained triggers a Stage-specific [[Star Bonus]], and each A Eternal Ability Card played grants an immediate Star Bonus (but no Star token).\n- The Star Acquisition Area has four spaces; a 5th Star is stacked on top.\n- In [[Stage E Silent]] Stars progressively unlock communication; in [[Stage F Dragon]] a Star comes from the River (two green 3s + three 8s) and another rides the Dragon Egg.\n- [[Stage A+ Advance]] removes the two Jewel-giving Stars, leaving only four in play.\n- In [[Story Mode]] unspent Stars convert to points and disc upgrades.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Starting Decks": {"md": "# Starting Decks\n\nFour five-card decks (one per player color) containing [[Number Cards]] numbered **1–5** in that color. At setup each player shuffles their Starting Deck face down to form their initial [[Player Deck]] and draws a three-card hand.\n\n- **2-player games** ([[Player Count Setups]]): each player picks a second color, shuffles that Starting Deck, removes three cards unseen, and puts the remaining two at the bottom of their Player Deck — a seven-card start.\n- **[[Stage F Dragon]]:** Starting Decks are *not* used; each player's assigned D [[Eternal Decks|Eternal Deck]] ([[Pegasus]]/[[Barong]]/[[Jinn]]/[[Kyubi]]) is the starting deck instead.\n- The Starting Task Cards of [[Stage E Silent]] ask you to reveal a 1/2/3/4/5 of your own color — i.e. a Starting Deck card ([[Task Cards]]).\n- Checking the [[Discard Area]] for your own Starting Deck cards is explicitly allowed.\n- After clearing [[Stage E+ Engagement]], the unlocked **GK Player Deck** (five purple GK Player Cards) can be used as an alternative starting deck ([[Gatekeeper]]).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Story Mode": {"md": "# Story Mode\n\n[[Solo Play]]'s campaign: **\"The Alchemist and the Cat.\"** [[The Alchemist]] controls the three Golems ([[Golem Alpha]], [[Golem Beta]], [[Golem Gamma]]) through Stages A–E in succession, researching the [[Jewels]] of the [[Eternal World]], scored out of 100 on a printable record sheet.\n\n## Key rule changes\n\n- **Every Stage additionally requires generating all six Jewels** on the 3-player Jewel Card and giving them to six Eternals — clearing a Stage's normal objective alone is not enough.\n- **The [[Witch]] (B-3) is not used.** Her [[Ability Cards|Ability Card]] becomes the **\"Beloved Cat Card\"**: in [[Stage B Ghost Town]] setup it occupies the top row alone (8-card deck returned to the box) with a [[Keys|Key]] on it; Reviving your Beloved Cat grants the Key without a Jewel. The Cat has no Curse and no ability; its Jewel (normally on the Stage B Card) is placed on it and can be given to an Eternal via the \"Generate a Jewel\" action. The Cat can be used **once** across Stages C–E (return it to the box after use); in Stage C Expert Mode you prepare C, A, and B Eternals (B replacing E).\n- In Stage D, once the GK's HP hits 0 (4 [[Keys]]) the [[Gatekeeper]] stops taking turns even if Jewels remain unfinished.\n- Stage E uses two [[Task Cards|Tasks]] per Golem, no Starting Tasks; Stage E is only cleared once four Keys **and** all Jewel obligations (including Golem-stored and Beloved-Cat Jewels) are met.\n\n## Scoring and progression\n\n- Per Stage: 1 point per [[Stars|Star]] (max 4), 1 per unspent [[Hearts|Heart]] (max 2), 1 per [[Rare Cards|Rare]] in River/hand (max 2) — up to 8/Stage, 40 total; −1 per Stage lost once (second loss: 0 and forced move on); up to 15 points from unspent Star points; 45 from Golem ability tracks = **100**.\n- **Disc enhancements:** spend gained Stars to fill diamonds on each Golem's ability track, unlocking stronger disc abilities (draw two, draw from the [[Random Deck]], give cards, ignore Curses, store cards…). Jewel-track diamonds unlock color-themed powers per Golem.\n- **\"Store a card\":** once per Stage per Golem, stash a matching Number/Rare card from hand under the Golem (2 points each, extra for Rares in C/D; stored cards shrink future Eternal decks). Storing in A/B unlocks abilities; storing in E places a bonus Jewel on the Golem.\n- **Endings by score:** <60 the mystery deepens; 60–69 success; 70–79 the beloved cat wears the hat; 80–89 maybe the 1/5/9 mystery next; 90+ \"closer to unravelling the Eternal World itself.\"\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Taking a Turn": {"md": "# Taking a Turn\n\nOn your turn you must perform **exactly one** of three actions. Play then proceeds clockwise. Failing to act at all loses the game for everyone (the [[Cycle of Life]]).\n\n## The three actions\n\n1. **Play a Card**\n   - **To [[The Field]]:** choose the top, middle, or bottom row and play one card to the leftmost empty space, obeying [[Common Placement Rules]], the row's [[Field Cards|Field Card]] rule, and any active [[Curse of the Eternals|Curses]]. Only one card may go to the Field per turn. Once placed, a card cannot be moved or rotated until the row is cleared. Playing the last space of a row triggers [[Revival]] (laps 1–3) or the [[4th Lap Bonus]].\n   - **To [[The River]]:** no placement rules; even Cursed cards are legal. The 5th card played triggers the [[River Bonus]].\n   - **Use an [[Ability Cards|Ability Card]]:** resolve its effect (usually played to the [[Discard Area]]). You may instead play it to the River without its effect.\n2. **Generate a [[Jewels|Jewel]]** — spend 1–3 cards from hand matching a [[Jewel Recipes|Jewel Recipe]]; the cards go to the River; give the Jewel to a Revived Eternal to break its Curse.\n3. **Give a Card to a Teammate** — spend a [[Hearts|Heart]] to pass any card from your hand to another player, face down.\n\n## Ending your turn\n\nDraw from your [[Player Deck]] until you hold three cards (you never discard down if you hold more; some effects like [[Jinn]]'s raise the refill target to four). If your deck is empty you simply hold fewer cards. If your last card Revives an Eternal, its deck immediately becomes your Player Deck and you refill from it.\n\nVariations: in [[Stage D Gate Keeper]] and [[Stage B+ Backup]] the [[Gatekeeper]] takes a turn after the last player. [[Pegasus]]' and Festival's effects allow (or, at Peak Time, require) playing two cards.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Task Cards": {"md": "# Task Cards\n\nSixteen cards defining the objectives of [[Stage E Silent]] (and [[Stage E+ Engagement]]). Tasks are held hidden (not part of your hand), revealed the moment they are completed; each completion advances your [[Keys|Key]].\n\n## Starting Task Cards (4, one per color)\n\nThe moment you gain the **3rd or 4th [[Stars|Star]]**, reveal a 1/2/3/4/5 of your matching color from hand ([[Starting Decks]] numbers; [[Two-Color Cards]] allowed, [[Rare Cards]] not; dead after the 4th Star). In Stage E+ they instead gate the win itself.\n\n## 6/7/8/9 Task Cards (4)\n\nPlay a 6/7/8/9 of any color to [[The Field]] **before the 3rd Star** is gained (Rares not allowed).\n\n## General Task Cards (8)\n\nMust be performed by the task's holder personally:\n\n- **Gain a Star** (×2) — not via A Eternal [[Ability Cards|Ability Card]].\n- **Generate a specific Jewel** (×2) — three same color / three different colors / three of the same number ([[Jewel Recipes]]); the [[Witch]] ability counts.\n- **Give a Jewel, 7th–9th Eternal** — a [[Jewels|Jewel]] to an Eternal in [[Revival Area]] spaces 7–9 (a [[Golem]] steal from those spaces also counts).\n- **Complete the puzzle** — play cards to top, middle, and bottom rows of one column; you need only play the last card (any row), all three in the same column; substitutes (Rares, [[Minotaur]], etc.) allowed.\n- **Have a Rare Card in your hand** — checked when the 2nd or 4th Star is gained.\n- **Play a Rare Card** — to the right of, and adjacent to, another Rare in the same row (not via Minotaur/CAMP cards).\n\n## Distribution\n\n4 players: three tasks each (Starting + 6/7/8/9 + General), leftovers removed; the unneeded final task is discarded face up. 3 players: keep your final task after your Key arrives, then draw General Tasks one at a time — completing them advances the unused Key color(s). 2 players: as 3p, plus draw a General Task after every completion. In [[Solo Play]], all tasks are revealed up front; in Stage E+, tasks must be completed by the player **whose turn is before yours**, and the \"7th–9th Eternal\" and \"Have a Rare\" tasks are removed.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "The Field": {"md": "# The Field\n\nThe three card rows in the middle of the [[Game Board]] where the [[Cycle of Life]] plays out. Each row is governed by a [[Field Cards|Field Card]] (top / middle / bottom) and ends at the sleeping [[Eternals]] on its right.\n\n## Playing to the Field\n\n- One card per turn, to the **leftmost empty space** of a chosen row ([[Taking a Turn]]).\n- Placement is constrained by the [[Common Placement Rules]], the row's Field Card rule, and all active [[Curse of the Eternals|Curses]].\n- Cards cannot be moved or rotated once played (until the row clears). [[Minotaur]]'s ability is the exception, swapping itself into the Field.\n\n## Filling a row\n\nPlaying the card **directly to the left of the Eternals** completes a *lap*:\n\n- **Laps 1–3:** the player [[Revival|Revives]] an Eternal of their choice from that row; played cards are cleared to the [[Discard Area]].\n- **Lap 4:** the row grants its [[4th Lap Bonus]] and then **closes** ([[Laps and Closing Rows]]).\n\nDepending on game mode, a stack of Field Cards may sit under a row and rotate in as laps complete ([[Difficulty Modes]]). In [[Stage C Labyrinth]] the Field doubles as the puzzle grid ([[Puzzle Cards]]); in [[Stage D Gate Keeper]] the [[Gatekeeper]] plays [[Skull Cards]] into the Field on its turn.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "The River": {"md": "# The River\n\nThe \"River of Life\" — the five-space row at the bottom of the [[Game Board]].\n\n- **No placement rules:** any card may be played here, including cards banned from [[The Field]] by [[Curse of the Eternals|Curses]] ([[Skull Cards]] are the exception — they may not enter the River until [[Stage F Dragon]]'s Key Bonus Rare Card is gained).\n- All cards spent on [[Jewels|Jewel]] generation are played into the River.\n- **When the 5th card lands** the team gains the [[River Bonus]] (a [[River Rare Cards|River Rare Card]] — or the [[Game Over Card]] if none remain). If a Jewel dumps more than five cards in at once, the bonus still triggers and *all* cards are cleared to the [[Discard Area]].\n- Playing a single card to the River is a legal stand-alone action ([[Taking a Turn]]) — a common way to bait out the 5th-card bonus or to dispose of an [[Ability Cards|Ability Card]] unused.\n- [[Kraken]]'s ability retrieves two cards from the River to hand.\n- **[[Stage F Dragon]]** upgrades the River into an engine: Jewels can be generated *from* the five cards in the River (four River [[Jewel Recipes]]), and specific River contents grant a [[Keys|Key]] (five 5s/7s), a [[Stars|Star]] (two green 3s + three 8s), or the GK Disc (Rare + purple Skull + two purple + any).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Two-Color Cards": {"md": "# Two-Color Cards\n\n[[Number Cards]] that carry **two colors** — either red/green or blue/yellow — split diagonally, with **one number** (printed in both corners, like any Number Card).\n\n## Playing to the Field\n\n- The diagonal split means the card presents one color on its **left side** and the other on its **right side**. When you play it, you **may rotate it right-side up or upside down to choose which color faces which side**; it cannot be rotated afterward.\n- [[Common Placement Rules|Adjacency]] is checked **per side**: the left-side color against the left neighbor, the right-side color against any card later played to its right (the rulebook's paired \"on its left side / on its right side\" clauses). A blue/yellow card *can* sit next to a blue card — yellow side facing it.\n- Its single number follows the normal number rules (sequences, same-number adjacency).\n- **The card is still *both* colors where identity matters:** color [[Curse of the Eternals|Curses]] ban it via either color ([[Medusa]] red & red/green, [[Minotaur]] blue & blue/yellow, [[Kraken]] green & red/green, [[Mummy]] yellow & blue/yellow), and on [[Lake]]/[[Swamp]] a Two-Color Card played first leaves the cycle color **undetermined** — the next card may follow either of its colors.\n\n## Choosing one color\n\n- **Generating [[Jewels]]:** \"you choose which color you are using.\"\n- **[[Skull Cards]]:** may cover a Skull of either of its colors.\n- **[[Stage C Labyrinth]] puzzles:** you declare its color, regardless of Field orientation; Two-Color Cards stay legal where [[Rare Cards]] are banned ([[Stage C+ Combination]], [[Task Cards]], the [[Stage E+ Engagement]] Starting Task).\n\n**Interpretation note:** the side-facing adjacency reading is reconstructed from the rulebook's left-side/right-side clauses, the rotation ✗→✓ examples (Basic Rulebook p. 09 sidebar), and the physical cards (single number confirmed on the actual components, 2026-07-21). An earlier wiki revision wrongly claimed two different numbers per card and both-colors-both-sides adjacency — corrected.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]] · physical card verification by the maintainer\n", "folder": "concepts"}, "Verbal Discussion": {"md": "# Verbal Discussion\n\nThe communication rules that keep hidden hands meaningful. **It is prohibited to directly state the number or color of [[Number Cards]] in your hand** (\"I have a 1\", \"I have a yellow card\", \"I don't have blue cards\" are all illegal). Indirect talk is encouraged.\n\n## Legal\n\n- Talking about [[Rare Cards]], [[Ability Cards]], and [[Skull Cards]] in your hand.\n- Talking about any card already played ([[The Field]], [[The River]], [[Jewels]]).\n- Deck-level inference: \"I'm using the [[Phoenix]] deck — when I play a high number it will be red.\"\n- Curse talk: \"The Phoenix Curse prohibits the number 1\" (referring to the Curse, not your hand).\n- Planning: \"I can place a card here\", \"Who should I Revive?\", \"It looks like Yellow is running out of cards.\"\n\n## Escalations and exceptions\n\n- [[Ghost]]'s ability and several [[Star Bonus]]es reveal hands and open full discussion until end of turn.\n- **[[Stage E Silent]]:** verbal discussion is banned outright (rules clarifications excepted) and even [[Communication Discs]] must be unlocked; [[Stage E+ Engagement]] also bans gestures.\n- **Hard mode suggestion:** no verbal discussion at all, discs only.\n- [[Creative Mode]] titles adjust this per player (\"Silent Supporter\", \"Master of the Discs\").\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "White Skull Cards": {"md": "# White Skull Cards\n\nThe four **White Skull Star Cards** are the [[Star Bonus]] of [[Stage D Gate Keeper]]: each time the team earns a [[Stars|Star]], one White Skull Card is added to a player's hand (when the [[Gatekeeper]] gains a Star via its Jewel abilities, the next player in turn order receives it).\n\n- Can only be played **on top of colored [[Skull Cards]]** that are already in [[The Field]] — anywhere on the Field.\n- Any colored [[Number Cards|Number Card]] can then be played on top of a White Skull Card, making them color-adapters for [[Gatekeeper Battle]] damage.\n- Only four exist; after the last one, Stars grant no additional bonus in Stage D.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Winning and Losing": {"md": "# Winning and Losing\n\n*Eternal Decks* is fully cooperative — all players win or lose together.\n\n## All players lose when\n\n- A player **cannot take any of the three actions** on their turn ([[Taking a Turn]], [[Cycle of Life]]).\n- A player draws the [[Game Over Card]] — from the [[River Bonus]] with no [[River Rare Cards]] left, or after the [[Gatekeeper Deck]] runs out in [[Stage D Gate Keeper]]/[[Stage B+ Backup]].\n- Stage-specific failures: Festival Peak Time's two-card requirement unmet ([[Stage B+ Backup]]); gaining the 4th [[Stars|Star]] before all four [[Keys]] — or with a player unable to complete their Starting Task — in [[Stage E+ Engagement]].\n\n## All players win when\n\n- **[[Stage A Nature Star]]:** the 4th [[Stars|Star]] is gained (six available).\n- **Stages B–F:** all four [[Keys]] are gained (methods vary by Stage).\n- [[Practice Mode]]: all nine Eternals Revived.\n\n**If a win and a loss occur simultaneously, the win takes priority** (e.g. drawing the Game Over Card in the same action that earns the 4th Star).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "concepts"}, "Barong": {"md": "# Barong\n\n**D Eternal · Blue** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]] (positive):** When playing cards to [[The Field]], **up to two cards of the same color may be adjacent** — relaxing the color half of the [[Common Placement Rules]]. The same-number rule still applies, [[Field Cards|Field Card]] rules must be followed, it works in all three rows and multiple times per row, and it even lets two purples sit adjacent on [[Lake]]/[[Swamp]]. It also lets a blue card cover a spot next to a blue [[Skull Cards|Skull]] (and the exemption persists for cards played on top even after the Curse ends).\n- **[[Eternal Decks|Deck]]:** three [[Skull Cards]], no Ability Card.\n- **[[Stage F Dragon]]:** assigned to the **Blue player**.\n- The Gatekeeper's Turn rules refer to \"Baron's Curse\" — flagged as a typo for Barong on the [[Eternal Decks Rulebook (4th Edition)|source page]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Bodogekazoku": {"md": "# Bodogekazoku\n\nCredited with development of *Eternal Decks* (\"DEVELOP / BODOGEKAZOKU\"), alongside designer [[Hiroken]] and publisher [[Tricktakers Games]]. (The name reads as Japanese *bōdoge kazoku* — \"board game family.\")\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Camp": {"md": "# Camp\n\n**[[Field Cards|Field Card]] · Difficulty ✦** — the easiest Field.\n\n**Rule:** No additional placement rules; only the [[Common Placement Rules]] apply (no same color or same number adjacent).\n\n- The only Field Card with **two copies**: one for normal row duty, one as the **CAMP Bonus Card** — the top row's [[4th Lap Bonus]], played onto another row to convert its rule to Camp for the rest of the game.\n- Bottom row of [[Stage A Nature Star]] and [[Practice Mode]] Beginner setups; excluded from Expert-mode stacks; a [[Stage F Dragon]] Key Bonus converts any Field to Camp.\n- The CAMP Bonus Card counts as any color in [[Puzzle Cards|puzzles]] (banned in [[Stage C+ Combination]]), deals 0 damage on a [[Skull Cards|Skull]], and cannot be taken by [[Minotaur]].\n- [[Festival]] shares Camp's placement rules.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Castle": {"md": "# Castle\n\n**Ghost Town [[Field Cards|Field Card]] · Difficulty ✦✦✦✦✦** ([[Stage B Ghost Town]]).\n\n**Rule:** Cards must be played in **ascending order** ([[Mountain]]'s rule) **and all of the same color**. Purple can substitute for the selected color, and — overriding the [[Common Placement Rules]] — the same color and purple **can** be adjacent here; **the same number still cannot be adjacent**.\n\n- Example row from the card: 1 → 3 → 5 → 8 → 9 → Rare, all one color.\n- One of the four cards shuffled into the Stage B top-row stack (with [[Lost Forest]], [[Fog]], [[Festival]]); also seeds the bottom-row stacks of [[Stage F Dragon]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Cave": {"md": "# Cave\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦✦**\n\n**Rule:** Cards must be played in **descending order** (highest to lowest number) — [[Mountain]]'s mirror.\n\n- Special rule: any number of [[Rare Cards]] (or [[Skull Cards]]) can be played to the right of a 1.\n- Middle row of [[Stage A Nature Star]] and [[Practice Mode]] Beginner setups.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Cyclops": {"md": "# Cyclops\n\n**E Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]] (one-shot, on [[Revival]]):** Move **two cards in [[The Field]]** to the [[Discard Area]] — priority right to left, top to bottom; [[Skull Cards]] and the CAMP Bonus Card are fair game; the row Cyclops was Revived from is ignored (already clearing); one or zero cards in the Field → discard what's there. Undoing careful row progress is the sting.\n- The GK Attack roll of 2 in [[Stage D+ Destiny]] copies this effect.\n- **[[Eternal Decks|Deck]]:** eight random [[Random Deck]] cards, no Ability Card.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Desert": {"md": "# Desert\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦✦✦✦** — one of the two hardest general Fields.\n\n**Rule:** Cards must be played with **consecutive numbers** (each new card exactly ±1 from its neighbor; a 1 or 3 must sit next to a 2). **1 and 9 are not consecutive** — the sequence does not wrap.\n\n- The exact inverse of [[Forest]]. The card's diagram shows the up-and-down zigzag a Desert row typically follows (e.g. 2-3-4-3-4).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Dragon": {"md": "# Dragon\n\nThe 24th [[Eternals|Eternal]] and the heart of the story: \"the mystery of this strange life is related to the Dragon's egg.\"\n\n- **In play:** appears only in [[Stage F Dragon]]. Its **egg** sits atop the [[Random Deck]]/E-Eternal stack in the 4th Lap Bonus Area with a [[Stars|Star]] on it. When the bottom [[The Field|Field]] row completes its fourth lap, the Dragon is **[[Revival|Revived]]**: the [[Dragon Deck]] (the row's seven cards + a chosen [[Gatekeeper Deck|GK card]]) goes to the reviving player, and the Egg's Star is claimed.\n- The Revived Dragon rests **on top of the [[Game Over Card]]** in the [[River Bonus]] Area — removing that loss condition forever. The Dragon is never moved to the [[Discard Area]]. Its revival also releases the four E Eternals into the bottom row.\n- **In the story:** the ending reveals that \"the law that maintains the cycle of life is the dragon itself, and the phenomenon of shortened lifespans was caused by the reincarnation of dragons.\" Witnessing the Dragon's birth lets the [[Explorers]] understand the mystery of life and return home through the [[Ouroboros Ring]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Eternal World": {"md": "# Eternal World\n\nThe setting of *Eternal Decks* — the mystical realm the [[Explorers]] enter to solve the mystery of humanity's shortening lifespans. Home of the [[Eternals]] and the [[Five Energies]].\n\nThe Stage-select illustration renders it as a **funnel of nested realms** ringed by an ouroboros: a vast natural expanse ([[Stage A Nature Star]]), a spooky town ([[Stage B Ghost Town]]), a labyrinth ([[Stage C Labyrinth]]), a great gate ([[Stage D Gate Keeper]]), an endless silent space ([[Stage E Silent]]), and at the bottom the Dragon's egg ([[Stage F Dragon]]).\n\nThe ending reveals the Eternal World and the original world are connected through the [[Ouroboros Ring]], with the [[Dragon]] as \"the law that maintains the cycle of life\" — the [[Cycle of Life]] mechanic made literal. [[The Alchemist]] continues researching it in [[Story Mode]], and at 90+ points comes \"closer to unravelling the Eternal World itself.\"\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Eternals": {"md": "# Eternals\n\nThe mystical creatures of the [[Eternal World]] — 24 in all. Most sleep at the end of [[The Field]]'s rows until [[Revival|Revived]], whereupon their [[Eternal Decks|deck]] joins a player's [[Player Deck]] and their [[Curse of the Eternals|Curse]] activates.\n\n## Families\n\n- **A Eternals** (number Curses; shared Star-granting [[Ability Cards|Ability]]): [[Phoenix]] (A-1), [[Mermaid]] (A-2), [[King]] (A-3), [[Fairy]] (A-4)\n- **B Eternals** (the \"ghost-type\" Eternals of [[Stage B Ghost Town]]): [[Ghost]] (B-1), [[Skeleton]] (B-2), [[Witch]] (B-3), [[Vampire]] (B-4)\n- **C Eternals** (color Curses): [[Medusa]] (C-1), [[Minotaur]] (C-2), [[Kraken]] (C-3), [[Mummy]] (C-4)\n- **D Eternals** (the \"Positive Eternals\" of [[Stage D Gate Keeper]]; beneficial Curses, three [[Skull Cards]] each): [[Pegasus]] (red), [[Barong]] (blue), [[Jinn]] (green), [[Kyubi]] (yellow)\n- **E Eternals** (the \"Random Eternals\" of [[Stage E Silent]]; [[Random Deck]] decks, one-shot Curses): [[Yeti]], [[Kappa]], [[Cyclops]], [[Golem]]\n- **The three Golems** (player avatars in [[Solo Play]] and [[Practice Mode]]): [[Golem Alpha]], [[Golem Beta]], [[Golem Gamma]]\n- **F:** the [[Dragon]], Revived only in [[Stage F Dragon]].\n\nEach family fields only **three of its four** members per game (d4 removal — [[Difficulty Modes]]). An Eternal card face-down shows its letter-number, icon, name (English/Japanese), Curse, Ability, and deck contents; face-up, its full portrait.\n\nThe [[Gatekeeper]] opposes the [[Explorers]] but is not one of the 24 (it is a former Explorer — [[Stage D+ Destiny]]).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Explorers": {"md": "# Explorers\n\nThe player characters. With humanity plagued by shortening lifespans, the Explorers journey to the [[Eternal World]] to solve the mystery of life, encountering the [[Eternals]] across the six [[Stages]].\n\n- Each Explorer is identified by a player color (red/blue/green/yellow — [[Five Energies]]), with matching [[Starting Decks|Starting Deck]], [[Communication Discs]], and [[Keys|Key]].\n- Their five starting [[Number Cards]] \"represent the life energy flowing within them\" ([[Cycle of Life]]).\n- The [[Gatekeeper]] is revealed in [[Stage D+ Destiny]] to be a former Explorer; [[Stage F Dragon]]'s ending sees the Explorers return home through the [[Ouroboros Ring]], and the [[Stage E+ Engagement]] epilogue closes their arc with the \"circulation of eternity.\"\n- In [[Solo Play]], the Golems ([[Golem Alpha]]/[[Golem Beta]]/[[Golem Gamma]]) and [[The Alchemist]] take the Explorers' place; [[Stage C+ Combination]] speaks of \"the Explorers' powers\" completing the giant puzzle.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Fairy": {"md": "# Fairy\n\n**A-4 · A Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Number 9 cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** A Eternal Ability Card ([[Stars|Star]] logic — see [[Ability Cards]]).\n- Sits out the fixed Beginner setup of [[Stage A Nature Star]] (Phoenix/Mermaid/King are used); enters play via the d4 family randomization of other [[Difficulty Modes]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Festival": {"md": "# Festival\n\n**Ghost Town [[Field Cards|Field Card]] · Difficulty ✦** ([[Stage B Ghost Town]]).\n\n**Rule:** Same placement rules as [[Camp]] (common rules only). **While the Festival is active, an always-available ability applies to all players:** on your turn you may play **one or two cards** to any Field row(s) and/or [[The River]] (two in Field / two in River / one each — the same menu as [[Pegasus]]' Curse). Bonuses/[[Revival|Revivals]] from a two-card play resolve after both cards; after a fifth River card you cannot play a sixth.\n\n- **Festival Peak Time** ([[Stage B+ Backup]]): with the [[Gatekeeper]]'s arrival the Festival \"reaches its peak time\" — the option becomes an obligation: **you must play two cards** to Field/River each turn, and being unable to (zero or one card in hand) loses the game. Abilities, [[Jewels|Jewel]] generation, and [[Hearts|Heart]] gifts don't count toward the two.\n- Part of the Stage B top-row stack and [[Stage F Dragon]]'s bottom-row stacks; the [[Creative Mode]] *Peak Time* achievement clears Stage B under Peak Time rules.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Fog": {"md": "# Fog\n\n**Ghost Town [[Field Cards|Field Card]] · Difficulty ✦✦✦✦✦** ([[Stage B Ghost Town]]).\n\n**Rule:** All cards must be **the same number**. The same number **can** be adjacent (a full inversion of the [[Common Placement Rules]]); **the same color cannot be adjacent**.\n\n- Example row from the card: 3 3 3 Rare 3 3 in alternating colors.\n- The purest test of the team's collective hand knowledge — five-plus cards of one number in rotating colors. Part of the Stage B top-row stack and [[Stage F Dragon]]'s bottom-row stacks.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Forest": {"md": "# Forest\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦**\n\n**Rule:** You cannot play **consecutive numbers** next to each other (e.g. neither 3 nor 5 may sit beside a 4).\n\n- One of the four Standard-mode bottom-row stack cards ([[Difficulty Modes]]), alongside [[Lake]], [[Grassland]], and [[Riverside]].\n- [[Desert]] is its exact inverse (consecutive required); [[Lost Forest]] is its harsher Ghost Town cousin (within-two banned + same color required).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Gatekeeper": {"md": "# Gatekeeper\n\nThe great figure blocking the gate out of the [[Eternal World]] — the game's antagonist-turned-guardian, abbreviated **GK** throughout the rulebook.\n\n## Mechanical roles\n\n- **[[Stage D Gate Keeper]]:** the boss. 20 HP tracked on the GK HP Card; takes a turn after the last player, playing [[Skull Cards]] and GK [[Ability Cards]] from the [[Gatekeeper Deck]]; damaged via [[Gatekeeper Battle]]; its deck running out ends the game in defeat.\n- **[[Stage B+ Backup]]:** crashes the Ghost Town — takes turns as in Stage D but **cannot be damaged**; its deck is a pure timer.\n- **[[Stage D+ Destiny]]:** revealed as **a former [[Explorers|Explorer]]** who visited the Eternal World; adds the Finisher/Counter rules and the d4 **GK Attack** table (via the GK Attack Card).\n- **[[Stage F Dragon]]:** its 2nd Half Deck powers the [[Star Bonus]] and one card joins the [[Dragon Deck]]; the **GK Disc** (also its HP/position marker in D) becomes a wild [[Communication Discs|disc]] for the [[Individual Revival Areas]] Key.\n- **Post-[[Stage E+ Engagement]]:** the five purple **GK Player Cards** unlock as an alternative [[Starting Decks|starting deck]].\n\n## In the story\n\nThe [[Stage F Dragon]] ending: \"Under the watchful eye of the Gatekeeper, you return to your original world safely\" — the fight gives way to guardianship, foreshadowed by its human origin.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Ghost": {"md": "# Ghost\n\n**B-1 · B Eternal** ([[Eternals]]) — one of the four \"ghost-type\" Eternals freed in [[Stage B Ghost Town]].\n\n- **[[Curse of the Eternals|Curse]]:** Number 5 & 7 cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** Reveal all cards in players' hands; players can discuss them until the end of the current turn, then take them back. This exact effect recurs as the 3rd–5th [[Stars|Star]] unlock in [[Stage E Silent]] and the 4th Star in [[Stage E+ Engagement]] (where using the Ghost is discouraged but legal). In [[Solo Play]] the reveal icon instead means \"each Golem draws one card.\"\n- Appears in the middle row of [[Stage A Nature Star]] Beginner setup and the top row of Stage B (with its [[Keys|Key]]).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Golem Alpha": {"md": "# Golem Alpha\n\nOne of the three player-avatar Golems of [[Solo Play]], [[Story Mode]], and [[Practice Mode]] ([[Eternals]]; distinct from the Jewel-stealing E Eternal [[Golem]]). **Player color: red.** In Story Mode, Alpha is the starting Golem in turn order (Alpha → Beta → Gamma).\n\n## Disc ability track ([[Story Mode]])\n\nBase (pre-filled): **draw one card from your deck, add it to your hand.** Unlockable upgrades (fill diamonds with earned [[Stars]]): draw two cards instead of one → draw from the [[Random Deck]] (or your deck) → give a card from your hand to another Golem → play a card ignoring all [[Curse of the Eternals|Curses]] → store cards in other Golems.\n\n**Jewel-track unlocks** (via the \"Store a card\" modification): red cards allow specifying any color when generating [[Jewels]]; red cards allow specifying any number; with four cards in hand, generate any of the six Jewels (spending all four).\n\n## Naming note\n\nThe Basic Rulebook's [[Practice Mode]] says \"Alpha, Gamma, and Delta Golems\" — flagged as a likely misprint for Alpha/Beta/Gamma on the [[Eternal Decks Rulebook (4th Edition)|source page]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Golem Beta": {"md": "# Golem Beta\n\nOne of the three player-avatar Golems of [[Solo Play]] and [[Story Mode]] ([[Eternals]]; see also [[Golem Alpha]], [[Golem Gamma]], and the unrelated E Eternal [[Golem]]). **Player color: green.** Second in Story Mode turn order.\n\n## Disc ability track ([[Story Mode]])\n\nBase (pre-filled): **give a card from your hand to another Golem.** Unlockable upgrades: draw two cards from your deck → give any number of cards to one Golem → play a card ignoring all [[Curse of the Eternals|Curses]] → add a card from [[The River]] to your hand → give one disc to a Golem (uses two discs).\n\n**Jewel-track unlocks:** a green 1/5/9 can be given to a Golem without a [[Hearts|Heart]]; at setup put two random blue [[Starting Decks|Starting Deck]] cards at the bottom of your deck; add one blue disc to your supply.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Golem Gamma": {"md": "# Golem Gamma\n\nOne of the three player-avatar Golems of [[Solo Play]] and [[Story Mode]] ([[Eternals]]; see also [[Golem Alpha]], [[Golem Beta]], and the unrelated E Eternal [[Golem]]). **Player color: yellow.** Third in Story Mode turn order.\n\n## Disc ability track ([[Story Mode]])\n\nBase (pre-filled): **play a card ignoring all [[Curse of the Eternals|Curses]].** Unlockable upgrades: draw one card from the [[Random Deck]] → give a card from your hand to another Golem → move the rightmost card on [[The Field]] (check all rows) to the [[Discard Area]] → play one card face down as a [[Rare Cards|Rare]] (uses two discs) → refill to four at end of turn (continuous; uses two discs).\n\n**Jewel-track unlocks:** yellow cards can be played ignoring all Curses; refill to four; when preparing [[Eternals]] at setup, choose freely instead of rolling the d4.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Golem": {"md": "# Golem\n\n**E Eternal** ([[Eternals]]). Not to be confused with the three player-avatar Golems ([[Golem Alpha]], [[Golem Beta]], [[Golem Gamma]]).\n\n- **[[Curse of the Eternals|Curse]] (one-shot, on [[Revival]]):** **Steals a [[Jewels|Jewel]]** from a Revived Eternal in the [[Revival Area]] — priority left to right; the stolen Jewel sits on the Golem, and the robbed Eternal's Curse **re-activates**. No jeweled Eternals → nothing happens.\n- If the Golem lands in [[Revival Area]] spaces 7–9, the steal can complete the \"Give a Jewel, 7th–9th Eternal\" [[Task Cards|Task]].\n- The GK Attack roll of 4 in [[Stage D+ Destiny]] copies the effect, but the Jewel returns to the box instead.\n- **[[Eternal Decks|Deck]]:** eight random [[Random Deck]] cards, no Ability Card.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Grassland": {"md": "# Grassland\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦**\n\n**Rule:** Only cards numbered **1 / 2 / 3 / 4 / 8 / 9** may be played (5, 6, and 7 are banned).\n\n- One of the Standard-mode bottom-row stack cards ([[Difficulty Modes]]).\n- Compare [[Riverside]] (odd only) and [[Valley]] (even only) for the other number-filter Fields.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Himitsuri": {"md": "# Himitsuri\n\nCredited with the promotional video for *Eternal Decks* (\"PROMOTIONAL VIDEO / HIMITSURI\") on the [[Tricktakers Games]] credits page.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Hiroken": {"md": "# Hiroken\n\nGame designer of *Eternal Decks* (credited \"GAME DESIGN / HIROKEN\" on the Basic Rulebook credits page). Published by [[Tricktakers Games]], developed with [[Bodogekazoku]], art by [[Mujunsha]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Jinn": {"md": "# Jinn\n\n**D Eternal · Green** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]] (positive):** At the end of your turn, refill your hand to **four cards** instead of three ([[Player Deck]]).\n- **[[Eternal Decks|Deck]]:** three [[Skull Cards]], no Ability Card.\n- **[[Stage F Dragon]]:** assigned to the **Green player**; in [[Solo Play]] Stage F, Jinn is the only D Eternal that refills to four.\n- The [[Creative Mode]] beginner title \"The Jinn's apprentice\" copies this effect for a human player.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Kappa": {"md": "# Kappa\n\n**E Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]] (one-shot, on [[Revival]]):** Move one [[River Rare Cards|River Rare Card]] from the [[River Bonus]] Area to the [[Discard Area]] (none left → nothing; **Pro Mode:** discard a [[Purple Star Cards|Purple Star Card]] instead) — a direct hit on the team's loss clock.\n- The GK Attack roll of 3 in [[Stage D+ Destiny]] copies this effect.\n- **[[Eternal Decks|Deck]]:** eight random [[Random Deck]] cards, no Ability Card.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "King": {"md": "# King\n\n**A-3 · A Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Number 6 cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** A Eternal Ability Card ([[Stars|Star]] logic — see [[Ability Cards]]).\n- Appears in the top row of [[Stage A Nature Star]] Beginner setup. The [[Verbal Discussion]] example dialogue notes \"If you use the King, it will be easy to make a 1/5/9 [[Jewels|Jewel]]\" — implying the King's [[Eternal Decks|deck]] is rich in 1s/5s/9s (deck list not transcribed; see source open questions).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Kraken": {"md": "# Kraken\n\n**C-3 · C Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Green & red/green cards cannot be played to [[The Field]] (this also blocks green [[Skull Cards]] in [[Stage D Gate Keeper]]).\n- **[[Ability Cards|Ability]]:** Add any **two cards currently in [[The River]]** to your hand (only one if the River holds a single card) — hand-quality repair and River-bonus tempo control in one.\n- Appears in the bottom row of [[Stage A Nature Star]] Beginner setup.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Kyubi": {"md": "# Kyubi\n\n**D Eternal · Yellow** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]] (positive):** When playing cards to [[The Field]], **up to two cards of the same number may be adjacent** — relaxing the number half of the [[Common Placement Rules]] (the same-color rule still applies; [[Field Cards|Field Card]] rules must be followed; works across all rows, multiple times).\n- **[[Eternal Decks|Deck]]:** three [[Skull Cards]], no Ability Card.\n- **[[Stage F Dragon]]:** assigned to the **Yellow player**.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Labyrinth (Field Card)": {"md": "# Labyrinth (Field Card)\n\n**Stage-specific [[Field Cards|Field Card]] · Difficulty ✦✦✦✦** — the top-row Field of [[Stage C Labyrinth]] for all four laps.\n\n**Rule:** **Numbers must be symmetrically opposite** — the row must read as a numeric palindrome: first and last cards the same number, second and second-to-last the same, and so on (example: 1 · Rare · 8 · 8 · 4? · 1 with the mirror pairs marked). Colors do **not** need to be symmetrical, but **cards of the same color cannot be adjacent**. If the number of cards played in the row that lap is even, the two middle cards will share a number.\n\n- Since players don't know in advance how long the lap will run, reading intentions via [[Communication Discs]] is critical.\n- Also appears in the top-left of the Stage C setup diagrams stacked with its \"8 8 / 5 5 / 3 3\" mirrored artwork.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Lake": {"md": "# Lake\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦**\n\n**Rule:** Cards must follow the color cycle **red → blue → green → yellow → red…** May start with any color. **Purple can substitute for any color** in the cycle, but purple cannot be adjacent to another purple ([[Common Placement Rules]] note printed on the card).\n\n- If a [[Two-Color Cards|Two-Color]], [[Rare Cards|Rare]], or purple card is played first, no color is determined yet — e.g. after a red/green card, either blue (follows red) or yellow (follows green) is legal.\n- Numbers are unrestricted (unlike [[Swamp]], which adds a 1–5 cap to the same cycle).\n- One of the Standard-mode bottom-row stack cards ([[Difficulty Modes]]); featured in the [[Communication Discs]] example and the [[Gatekeeper Battle|GK turn]] example ([[Barong]]'s Curse lets two purples sit adjacent here).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Lost Forest": {"md": "# Lost Forest\n\n**Ghost Town [[Field Cards|Field Card]] · Difficulty ✦✦✦✦** ([[Stage B Ghost Town]]).\n\n**Rule:** Cards **within two consecutive values cannot be adjacent** (e.g. next to a 4, none of 2/3/5/6 may be played — a stricter [[Forest]]), **and all cards must be the same color**. Purple substitutes for the selected color; same color and purple **can** be adjacent (overriding the [[Common Placement Rules]]); **the same number still cannot be adjacent**.\n\n- Example row from the card: 6 → 2 → Rare → 2? → 8 → 5 (numbers at least three apart, one color).\n- Part of the Stage B top-row stack and [[Stage F Dragon]]'s bottom-row stacks.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Medusa": {"md": "# Medusa\n\n**C-1 · C Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Red & red/green cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** If any [[Rare Cards]] are in the [[Discard Area]], put one back in the [[River Bonus]] Area (checking the Discard first is fine; it need not be a [[River Rare Cards|River Rare]]; **Pro Mode:** a purple card may be placed instead).\n- Appears in the bottom row of [[Stage A Nature Star]] Beginner setup.\n- **Star of [[Stage A+ Advance]]:** with no River Rares placed at setup, \"with the help of Medusa and her companions you can get a Rare back into the River of Life\" — she **must** be included there, as the only defense against the 5th-River-card loss.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Mermaid": {"md": "# Mermaid\n\n**A-2 · A Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Number 4 cards cannot be played to [[The Field]] — called out as \"tough\" in the rulebook's [[Verbal Discussion]] example dialogue.\n- **[[Ability Cards|Ability]]:** A Eternal Ability Card ([[Stars|Star]] logic — see [[Ability Cards]]).\n- Appears in the top row of [[Stage A Nature Star]] Beginner setup; the [[Revival]] walkthrough uses the Mermaid as its example (Revived by the Yellow player, deck to the bottom of their [[Player Deck]]).\n- The [[Difficulty Modes]] d4 example removes the Mermaid on a roll of 2.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Minotaur": {"md": "# Minotaur\n\n**C-2 · C Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Blue & blue/yellow cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** Exchange this card with **any card in [[The Field]]**; the Minotaur card stays there, treated as a [[Rare Cards|Rare Card]] — the only Ability played into the Field. It cannot take the CAMP Bonus Card ([[4th Lap Bonus]]). With [[Skull Cards]]: if a Number Card sits on a Skull, you take the Number Card and the Minotaur goes on top of the Skull.\n- In [[Stage C Labyrinth]] the swap counts as any color for [[Puzzle Cards|puzzles]] — it can even fix a mis-played card to finish a puzzle (the rulebook's Level-4 example wins the stage this way). Banned from puzzles in [[Stage C+ Combination]] and from [[Task Cards]].\n- Appears in the bottom row of [[Stage A Nature Star]] Beginner setup.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Mountain": {"md": "# Mountain\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦✦**\n\n**Rule:** Cards must be played in **ascending order** (lowest to highest number).\n\n- Special rule: any number of [[Rare Cards]] (or [[Skull Cards]]) can be played to the right of a 9.\n- A Rare played first counts as \"1 at minimum\" — the next card can be 2 or higher.\n- The workhorse top-row Field: fixed for all four laps in [[Stage D Gate Keeper]], [[Stage E Silent]], and [[Stage F Dragon]]; top row of [[Stage A Nature Star]] and [[Practice Mode]]; excluded from Expert-mode stacks ([[Difficulty Modes]]).\n- [[Castle]] is its harder Ghost Town cousin (ascending + same color).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Mujunsha": {"md": "# Mujunsha\n\nTokyo-based studio credited with the artwork of *Eternal Decks* (\"ART WORK / MUJUNSHA TOKYO\") — the vividly colored folk-art [[Eternals]], the ouroboros motifs ([[Ouroboros Ring]]), and the black-and-gold board and card design.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Mummy": {"md": "# Mummy\n\n**C-4 · C Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Yellow & blue/yellow cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** Draw **three cards total from any [[Player Deck|Player Decks]]** and add them to your hand — you may look at each card before choosing which deck to draw the next from; you must draw three if the decks allow (fewer only if fewer remain across all decks).\n- Sits out [[Stage A Nature Star]] Beginner setup; enters via the d4 randomization of other [[Difficulty Modes]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Ouroboros Ring": {"md": "# Ouroboros Ring\n\nThe serpent-eating-its-tail motif that frames *Eternal Decks* — on the Stage Description rulebook cover, around the Stage-select funnel of the [[Eternal World]], and on the [[Game Over Card]] (shattered, on its back).\n\nStory significance ([[Stage F Dragon]] ending): \"The original world and the Eternal World are connected through the Ouroboros Ring\" — the passage by which the [[Explorers]] return home after witnessing the [[Dragon]]'s birth. As a symbol of the endless cycle, it is the visual twin of the game's [[Cycle of Life]] and of the \"circulation of eternity\" epilogue in [[Stage E+ Engagement]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Pegasus": {"md": "# Pegasus\n\n**D Eternal · Red** ([[Eternals]]) — one of the \"Positive Eternals\" of [[Stage D Gate Keeper]].\n\n- **[[Curse of the Eternals|Curse]] (positive):** On your turn, you may play **one or two cards** to any [[The Field|Field]] row(s) and/or [[The River]] (two Field / two River / one each). Bonuses and [[Revival|Revivals]] resolve after both cards; a 5th River card still caps the River at five; in [[Gatekeeper Battle]] the first card's damage resolves before the second.\n- **[[Eternal Decks|Deck]]:** contains three [[Skull Cards]] (as all D Eternals; no Ability Card).\n- **[[Stage F Dragon]]:** assigned to the **Red player** as their starting deck and [[Individual Revival Areas|Individual Revival Board]] companion; its effect benefits only that player.\n- In [[Solo Play]] Stage F, discs used during Pegasus' turn can draw from other D Eternals' decks as usual.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Phoenix": {"md": "# Phoenix\n\n**A-1 · A Eternal** ([[Eternals]]). The rulebook's example Eternal throughout.\n\n- **[[Curse of the Eternals|Curse]]:** Number 1 cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** A Eternal Ability Card — Stage Card Area in [[Stage A Nature Star]] (3rd one = [[Stars|Star]]); immediate [[Star Bonus]] in later Stages.\n- **[[Eternal Decks|Deck]]:** 3, 6, 6, 7, 8, 8, 9 + Ability Card (the only deck fully diagrammed in the rulebook) — a high-number deck, hence the [[Verbal Discussion]] example \"I'm using the Phoenix Deck. When I play a high number, it will be red.\"\n- Appears in the top row of Stage A Beginner setup alongside [[Mermaid]] and [[King]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Portland Game Collective": {"md": "# Portland Game Collective\n\nThanked in the *Eternal Decks* credits (\"SPECIAL THANKS / LEE GIANOU / Portland Game Collective\"); its PGC logo appears beside the [[Tricktakers Games]] mark on the credits page.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Riverside": {"md": "# Riverside\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦✦**\n\n**Rule:** Only **odd** numbers — 1 / 3 / 5 / 7 / 9 — may be played.\n\n- One of the Standard-mode bottom-row stack cards ([[Difficulty Modes]]); [[Valley]] is its even-numbered counterpart.\n- Appears in the [[Kyubi]] Curse example (red 3 → yellow 3 allowed under his same-number relaxation).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Ryan Campbell": {"md": "# Ryan Campbell\n\nEditor of the English rulebook of *Eternal Decks* (\"EDITOR / ENGLISH RULEBOOK / RYAN CAMPBELL\") — the edition this wiki's [[Eternal Decks Rulebook (4th Edition)|source]] is based on.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Skeleton": {"md": "# Skeleton\n\n**B-2 · B Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Number 2 & 8 cards cannot be played to [[The Field]].\n- **[[Ability Cards|Ability]]:** Recover 1 spent [[Hearts|Heart]] (move it right → left). If all three Hearts are unspent, playing the card does nothing.\n- Appears in the middle row of [[Stage A Nature Star]] Beginner setup (the [[Revival]] example has it Revived first) and the top row of [[Stage B Ghost Town]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Swamp": {"md": "# Swamp\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦✦✦✦** — one of the two hardest general Fields.\n\n**Rule:** [[Lake]]'s color cycle **red → blue → green → yellow → red…** (any starting color, purple substitutes, purple not adjacent purple) **plus only numbers 1 / 2 / 3 / 4 / 5** may be played.\n\n- The combined color+number constraint makes it the general game's tightest row; it is excluded from the Stage C Standard stacks ([[Difficulty Modes]]).\n- [[Starting Decks]] cards (1–5) are all Swamp-legal — a practical relief valve.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "The Alchemist": {"md": "# The Alchemist\n\nProtagonist of [[Story Mode]] — \"A story about an Alchemist and her beloved cat researching Jewels.\" She controls the three Golems ([[Golem Alpha]], [[Golem Beta]], [[Golem Gamma]]) through Stages A–E, researching the [[Jewels]] of the [[Eternal World]]; her performance is scored out of 100.\n\n- **The Beloved Cat:** her cat is lost in the Ghost Town during [[Stage B Ghost Town]] — represented by the \"Beloved Cat Card\" (the [[Witch]]'s Ability Card). Reviving the Cat grants a [[Keys|Key]]; the Cat can then assist once across Stages C–E. It has no Curse and no ability of its own.\n- **Her mission** (ending text): having unraveled the mystery of the Jewel, she hopes to create Jewels in the Eternal World without the Golems' help and to send her research back to our world, so that \"future researchers will unravel the mystery of human lifespan.\" At 70–79 points, \"my beloved cat was so happy that he started wearing my hat!\"\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Tricktakers Games": {"md": "# Tricktakers Games\n\nPublisher of *Eternal Decks* (credits: \"2025 TRICKTAKERS GAMES\"). The box includes English and Japanese rulebooks; [[Creative Mode]] notes the studio \"may officially release Stages that you have created, with you credited.\" Design [[Hiroken]], art [[Mujunsha]], development [[Bodogekazoku]]; English edition edited by [[Ryan Campbell]], promotional video by [[Himitsuri]], with thanks to Lee Gianou / [[Portland Game Collective]].\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Valley": {"md": "# Valley\n\n**[[Field Cards|Field Card]] · Difficulty ✦✦✦✦**\n\n**Rule:** Only **even** numbers — 2 / 4 / 6 / 8 — may be played.\n\n- Rated harder than its odd sibling [[Riverside]], presumably because only four legal numbers exist and the [[Common Placement Rules]] (no same number adjacent) bite harder.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Vampire": {"md": "# Vampire\n\n**B-4 · B Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** Purple cards cannot be played to [[The Field]] — a bane for [[Purple Star Cards]] and the purple-substitution tricks on [[Lake]]/[[Swamp]]/[[Castle]]/[[Lost Forest]].\n- **[[Ability Cards|Ability]]:** **None** — the only A–C Eternal with no Ability Card (its [[Eternal Decks|deck]] is presumably eight Number Cards; deck lists are untranscribed — see source open questions).\n- Sits out [[Stage A Nature Star]] Beginner setup; appears in the top row of [[Stage B Ghost Town]] with the other ghost-type Eternals.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Witch": {"md": "# Witch\n\n**B-3 · B Eternal** ([[Eternals]]).\n\n- **[[Curse of the Eternals|Curse]]:** [[Rare Cards]] cannot be played to [[The Field]] — the only Curse targeting Rares.\n- **[[Ability Cards|Ability]]:** Generate any one [[Jewels|Jewel]] **without using any cards** (cannot be used for the 1/5/9 recipe). In [[Stage F Dragon]] it can also generate any of the four River-recipe Jewels.\n- Appears in the middle row of [[Stage A Nature Star]] Beginner setup and the top row of [[Stage B Ghost Town]].\n- **[[Story Mode]]:** the Witch herself is not used; her Ability Card becomes the **\"Beloved Cat Card\"** — [[The Alchemist]]'s lost cat, Revived in the Ghost Town for a free [[Keys|Key]] and usable once in Stages C–E.\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "Yeti": {"md": "# Yeti\n\n**E Eternal** ([[Eternals]]) — one of the \"Random Eternals\" of [[Stage E Silent]].\n\n- **[[Curse of the Eternals|Curse]] (one-shot, on [[Revival]]):** All players move the top card of their [[Player Deck]] to the [[Discard Area]] face up (empty deck → nothing for that player). Fires once, then goes dormant.\n- Uniquely, **Yeti's Curse hits everyone even when Revived to an [[Individual Revival Areas|Individual Revival Area]]** in [[Stage F Dragon]].\n- The GK Attack roll of 1 in [[Stage D+ Destiny]] copies this effect.\n- **[[Eternal Decks|Deck]]:** eight random cards from the [[Random Deck]] (as all E Eternals; no Ability Card).\n\nSource: [[Eternal Decks Rulebook (4th Edition)]]\n", "folder": "entities"}, "index": {"md": "# Wiki Index\n\nThis is the main catalog for the LLM-maintained wiki about the board game **Eternal Decks**. Read this file first when navigating the knowledge base.\n\n## Core pages\n\n- [[overview|Overview]] — high-level synthesis of the wiki's current knowledge.\n- [[log|Log]] — chronological record of ingests, queries, lint passes, and maintenance.\n\n## Sources\n\n- [[Eternal Decks Rulebook (4th Edition)]] — the complete English rulebooks (Basic + Stage Description, 60 pp.); the wiki's primary source. Includes the component list, credits, and the flagged inconsistencies/open questions.\n\n## Concepts\n\n### Core system\n- [[Cycle of Life]] — must act every turn or everyone loses; the game's engine and theme.\n- [[Taking a Turn]] — the three actions (Play a Card / Generate a Jewel / Give a Card) and hand refill.\n- [[Winning and Losing]] — loss conditions, per-Stage win conditions, win-priority rule.\n- [[Stages]] — the six-Stage campaign structure and its extensions.\n- [[Game Board]] — map of all board areas.\n\n### Cards\n- [[Number Cards]] — the 1–9 cards in five colors; the basic currency of play.\n- [[Five Energies]] — Passion/Calm/Harmony/Challenge/Inspiration (red/blue/green/yellow/purple).\n- [[Two-Color Cards]] — dual-color cards (red/green, blue/yellow) and their rules.\n- [[Rare Cards]] — the wild cards; placement, jewel, and stage-by-stage rulings.\n- [[Ability Cards]] — one-shot effects; full effect list by Eternal.\n- [[Skull Cards]] — Stage D's hazard cards; playing and covering them.\n- [[White Skull Cards]] — Stage D's Star Bonus color-adapters.\n- [[Purple Star Cards]] — Stage B's Star Bonus; purple 1–9 cards.\n- [[Puzzle Cards]] — Stage C's sixteen pattern cards and matching rules.\n- [[Task Cards]] — Stage E's sixteen objective cards (Starting / 6-9 / General).\n- [[Game Over Card]] — instant-loss cards and where they lurk.\n- [[River Rare Cards]] — the River Bonus rewards and loss clock.\n\n### Decks\n- [[Starting Decks]] — the five-card player-color decks (and 2-player variant).\n- [[Player Deck]] — your personal deck: refill, growth, and depletion.\n- [[Eternal Decks]] — the 16 unique eight-card decks acquired by Revival.\n- [[Random Deck]] — the 40-card deck behind E Eternals and Practice/Pro setups.\n- [[Gatekeeper Deck]] — the GK's 16-card deck/timer and GK Player Deck unlock.\n\n### Board zones and placement\n- [[The Field]] — the three rows; playing, laps, and row mechanics.\n- [[Field Cards]] — the 16 row-rule cards with difficulty table.\n- [[Common Placement Rules]] — no same color / same number adjacent, and every exception.\n- [[The River]] — the River of Life; free plays, jewel spending, Stage F engine.\n- [[River Bonus]] — the 5th-card trigger and its variants.\n- [[Discard Area]] — the Vortex and the checking rules.\n- [[Revival Area]] — the nine-space Eternal lineup and why position matters.\n- [[Laps and Closing Rows]] — the four-lap row lifecycle.\n- [[4th Lap Bonus]] — CAMP conversion / Heart recovery / Star.\n\n### Core mechanics\n- [[Revival]] — waking Eternals and claiming their decks.\n- [[Curse of the Eternals]] — the full Curse table and family variations.\n- [[Jewels]] — generating and giving; curse-breaking.\n- [[Jewel Recipes]] — the eight hand recipes and four River recipes.\n- [[Stars]] — the six Stage A Stars and Stars beyond Stage A.\n- [[Star Bonus]] — per-Stage rewards for each Star.\n- [[Keys]] — the Stage B–F win currency and how each Stage awards them.\n- [[Hearts]] — the card-gifting resource.\n- [[Communication Discs]] — indirect signalling rules and stage variants.\n- [[Verbal Discussion]] — what you may and may not say.\n- [[Gatekeeper Battle]] — damage, the GK's turn, and GK abilities.\n- [[Individual Revival Areas]] — Stage F's personal revival boards.\n- [[Dragon Deck]] — assembling the Dragon's deck in Stage F.\n\n### Stages\n- [[Stage A Nature Star]] — the tutorial Stage; four of six Stars.\n- [[Stage B Ghost Town]] — revive the four ghost Eternals; Ghost Town Fields.\n- [[Stage C Labyrinth]] — solve four puzzle levels.\n- [[Stage D Gate Keeper]] — the Gatekeeper boss fight.\n- [[Stage E Silent]] — the silent trial; tasks and unlockable communication.\n- [[Stage F Dragon]] — the four-objective finale and the Dragon's revival.\n- [[Stage A+ Advance]] — four Stars, empty River Bonus, mandatory Medusa.\n- [[Stage B+ Backup]] — the GK crashes the Festival; Peak Time.\n- [[Stage C+ Combination]] — the Giant Puzzle, no wildcards.\n- [[Stage D+ Destiny]] — the Finisher, exact damage, GK Attacks.\n- [[Stage E+ Engagement]] — one disc, mind-reading tasks, the epilogue.\n\n### Modes\n- [[Difficulty Modes]] — Beginner/Standard/Expert/Pro and the Stage Setup Table.\n- [[Player Count Setups]] — 1–4 player adjustments.\n- [[Practice Mode]] — the pre-Stage-A training scenario.\n- [[Advanced Mode]] — the post-campaign A+–E+ layer.\n- [[Solo Play]] — piloting three Golems; Basic Mode and disc rules.\n- [[Story Mode]] — \"The Alchemist and the Cat\": campaign, scoring, upgrades.\n- [[Creative Mode]] — achievements, titles, and custom Stages.\n\n## Entities\n\n### The Eternals\n- [[Eternals]] — the 24 creatures and their family structure (start here).\n- **A Eternals:** [[Phoenix]] · [[Mermaid]] · [[King]] · [[Fairy]] — number Curses, Star-granting abilities.\n- **B Eternals:** [[Ghost]] · [[Skeleton]] · [[Witch]] · [[Vampire]] — the ghost-types of Stage B.\n- **C Eternals:** [[Medusa]] · [[Minotaur]] · [[Kraken]] · [[Mummy]] — color Curses, strong abilities.\n- **D Eternals:** [[Pegasus]] · [[Barong]] · [[Jinn]] · [[Kyubi]] — beneficial Curses, Skull Cards.\n- **E Eternals:** [[Yeti]] · [[Kappa]] · [[Cyclops]] · [[Golem]] — random decks, one-shot Curses.\n- **Solo Golems:** [[Golem Alpha]] · [[Golem Beta]] · [[Golem Gamma]] — the player avatars.\n- [[Dragon]] — the 24th Eternal and the story's heart.\n\n### Characters and places\n- [[Gatekeeper]] — the boss, timer, and eventual guardian; a former Explorer.\n- [[Explorers]] — the player characters.\n- [[The Alchemist]] — Story Mode's protagonist (and her Beloved Cat).\n- [[Eternal World]] — the setting and its nested realms.\n- [[Ouroboros Ring]] — the motif linking the two worlds.\n\n### Field Cards\n- **General:** [[Camp]] ✦ · [[Forest]] ✦✦ · [[Lake]] ✦✦ · [[Grassland]] ✦✦ · [[Mountain]] ✦✦✦ · [[Cave]] ✦✦✦ · [[Riverside]] ✦✦✦ · [[Valley]] ✦✦✦✦ · [[Desert]] ✦✦✦✦✦ · [[Swamp]] ✦✦✦✦✦\n- **Ghost Town:** [[Castle]] ✦✦✦✦✦ · [[Fog]] ✦✦✦✦✦ · [[Lost Forest]] ✦✦✦✦ · [[Festival]] ✦\n- **Labyrinth:** [[Labyrinth (Field Card)]] ✦✦✦✦\n\n### People and organizations\n- [[Hiroken]] — game designer.\n- [[Mujunsha]] — Tokyo art studio.\n- [[Bodogekazoku]] — development.\n- [[Tricktakers Games]] — publisher (2025).\n- [[Ryan Campbell]] — English rulebook editor.\n- [[Himitsuri]] — promotional video.\n- [[Portland Game Collective]] — special thanks (Lee Gianou).\n\n## Questions and analyses\n\n- [[Board Locations and Notation]] — the vault's standard coordinate system for board places (T/M/B rows, RA1–9, Riv1–5) and card shorthand; includes the board map.\n- [[Playing with Claude as a Second Player]] — protocol for the LLM as a full second seat: asymmetric hidden hands, turn loop, state tracking, photo reporting.\n", "folder": ""}, "log": {"md": "# Log\n\nAppend-only chronological record of ingests, queries, lint passes, and maintenance.\n\n## [2026-07-21] schema | Vault repurposed for Eternal Decks\n\nConverted the vault from its previous subject to an LLM wiki for the board game *Eternal Decks*: rewrote `AGENTS.md`, `CLAUDE.md`, and `wiki/index.md`; removed all leftover content from the prior wiki (including the unrelated `tools/` directory). Wiki layer started empty.\n\n## [2026-07-21] ingest | Eternal Decks Rulebook (4th Edition)\n\nIngested `raw/EternalDecks_EN_Rulebooks_4th_2026_0622.pdf` (60 pages: Basic Rulebook + Stage Description rulebook) — the wiki's primary source. Created:\n\n- 1 source page: [[Eternal
